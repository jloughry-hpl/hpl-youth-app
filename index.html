  var dEV=delta(r.maxEV,f.maxEV), dAvg=delta(r.avgEV,f.avgEV), dHH=delta(r.hardHitPct,f.hardHitPct), dDist=delta(r.maxDist,f.maxDist);
  var span=hasRap?(fmtDate(first.date)+' – '+fmtDate(last.date)):(cs.testCount+' test'+(cs.testCount!==1?'s':''));
  var laOK=(vAvgLA>=10&&vAvgLA<=25);
  var nSess=assess.length||cs.testCount;
  function card(k,v,sub,subcls){ return '<div style="flex:1;min-width:120px;background:#141614;border-top:3px solid var(--green);border-radius:12px;padding:12px 10px;text-align:center">'
    +'<div style="font-family:\'Barlow Semi Condensed\';font-weight:700;text-transform:uppercase;letter-spacing:.6px;font-size:9.5px;color:var(--green)">'+k+'</div>'
    +'<div style="font-family:\'Anton\';font-style:italic;font-size:24px;margin:5px 0 4px">'+v+'</div>'
    +'<div style="font-size:9.5px;color:'+(subcls==='up'?'var(--green)':(subcls==='down'?'#ff7b6b':'var(--grey)'))+';font-weight:600">'+sub+'</div></div>'; }
  var rows=assess.map(function(x){ return '<tr>'
    +'<td style="padding:8px 6px">'+x.label+'</td><td style="padding:8px 6px">'+fmtDate(x.date)+(x.n>1?' <span style="color:var(--grey)">· '+x.n+' tests</span>':'')+'</td>'
    +'<td style="padding:8px 6px;text-align:center">'+(x.rap.maxEV||'—')+'</td><td style="padding:8px 6px;text-align:center">'+(x.rap.avgEV||'—')+'</td>'
    +'<td style="padding:8px 6px;text-align:center">'+(x.rap.hardHitPct||0)+'%</td><td style="padding:8px 6px;text-align:center">'+(x.rap.maxDist||'—')+'</td>'
    +'<td style="padding:8px 6px;text-align:center">'+(x.rap.avgLA?x.rap.avgLA+'°':'—')+'</td></tr>'; }).join('');
  function para(title,body){ return '<div style="margin:14px 0 0"><div style="display:inline-block;border-left:4px solid var(--green);background:rgba(131,245,44,.08);padding:5px 10px;font-family:\'Barlow Semi Condensed\';font-weight:700;font-size:13px">'+title+'</div><p style="font-size:12.5px;line-height:1.55;color:#cfcfcf;margin:7px 2px 0">'+body+'</p></div>'; }
  var ec=evCategoryStats(p);
  var evSection='';
  if(ec.hasData){
    function evTr(lbl,s){ return '<tr><td style="padding:8px 8px;text-align:left">'+lbl+'</td>'
      +'<td style="padding:8px 6px;text-align:center">'+(s.n?s.avg:'—')+'</td>'
      +'<td style="padding:8px 6px;text-align:center">'+(s.n?s.max:'—')+'</td>'
      +'<td style="padding:8px 6px;text-align:center">'+s.n+'</td></tr>'; }
    var corr='';
    if(ec.correct.n && ec.missed.n){
      var d=+(ec.correct.avg-ec.missed.avg).toFixed(1);
      if(d>=2) corr='Avg EV is <b>'+d+' mph higher</b> when the color is read correctly — recognition is turning into better contact.';
      else if(d<=-2) corr='Avg EV is <b>'+Math.abs(d)+' mph higher on <u>misread</u> balls</b> — a sign of swinging first and reading second. Drill identifying the color before committing.';
      else corr='Avg EV is nearly even on correct vs misread reads ('+ec.correct.avg+' vs '+ec.missed.avg+' mph) — swings look color-agnostic right now; keep building pitch recognition.';
    } else if(ec.missed.n && !ec.correct.n){ corr='Every logged color swing so far was a misread — a clear pitch-recognition focus area.'; }
    else if(ec.correct.n){ corr='Color reads are landing so far — keep logging tests to track the trend.'; }
    var trend='';
    if(ec.byBlock.length){
      var trows=ec.byBlock.map(function(bb){ return '<tr><td style="padding:7px 8px;text-align:left">'+bb.label.replace('Weeks','Wk')+'</td>'
        +'<td style="padding:7px 6px;text-align:center">'+(bb.correct.n?bb.correct.avg:'—')+'</td>'
        +'<td style="padding:7px 6px;text-align:center">'+(bb.missed.n?bb.missed.avg:'—')+'</td>'
        +'<td style="padding:7px 6px;text-align:center">'+(bb.noncolor.n?bb.noncolor.avg:'—')+'</td></tr>'; }).join('');
      trend='<div class="section-lbl" style="margin:16px 2px 8px">Avg EV Trend by Block</div>'
        +'<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:11.5px;background:#141614;border:1px solid #2a2e2a;border-radius:10px">'
        +'<thead><tr style="background:rgba(131,245,44,.1);color:var(--green);font-family:\'Barlow Semi Condensed\';text-transform:uppercase;font-size:10px;letter-spacing:.4px">'
        +'<th style="padding:8px 8px;text-align:left">Block</th><th style="padding:8px 6px">Color read ✓</th><th style="padding:8px 6px">Color miss ✗</th><th style="padding:8px 6px">Non-color</th></tr></thead>'
        +'<tbody>'+trows+'</tbody></table></div>';
    }
    evSection='<div class="section-lbl" style="margin:20px 2px 8px">Exit Velo by Pitch Recognition</div>'
      +'<div style="font-size:11.5px;color:var(--grey);margin:0 2px 8px;line-height:1.5">Across all completed tests — exit velo when the hitter read the color correctly, misread it, and on non-color balls.</div>'
      +'<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:11.5px;background:#141614;border:1px solid #2a2e2a;border-radius:10px">'
      +'<thead><tr style="background:rgba(131,245,44,.1);color:var(--green);font-family:\'Barlow Semi Condensed\';text-transform:uppercase;font-size:10px;letter-spacing:.4px">'
      +'<th style="padding:8px 8px;text-align:left">Category</th><th style="padding:8px 6px">Avg EV</th><th style="padding:8px 6px">Max EV</th><th style="padding:8px 6px">Swings</th></tr></thead>'
      +'<tbody>'+evTr('Color — read correct',ec.correct)+evTr('Color — misread',ec.missed)+evTr('Non-color balls',ec.noncolor)+'</tbody></table></div>'
      +(corr?'<div style="margin-top:10px;background:rgba(131,245,44,.08);border:1px solid rgba(131,245,44,.3);border-radius:12px;padding:11px 13px;font-size:12px;line-height:1.5;color:#cdeeb0">'+corr+'</div>':'')
      +trend;
  }
  var nm=esc(p.first)+' '+esc(p.last);
  return '<div class="scroll" id="reportScroll">'
    +topbar('<button class="icon-btn" onclick="go(\'profile\',{playerId:\''+p.id+'\'})">'+IC.back+'</button>')
    +'<div class="pad" id="reportSheet">'
      +'<div style="background:#0d0f0d;border:1px solid #2a2e2a;border-bottom:3px solid var(--green);border-radius:14px;padding:16px 15px;display:flex;align-items:center;gap:14px">'
        +logoSVG(56)
        +'<div><div style="font-family:\'Barlow Semi Condensed\';font-weight:700;color:var(--green);letter-spacing:.5px;font-size:12px">PLAYER DEVELOPMENT REPORT</div>'
        +'<div style="font-family:\'Anton\';font-style:italic;font-size:24px;line-height:1">'+nm+'</div>'
        +'<div style="font-size:10.5px;color:var(--grey);margin-top:3px">'+nSess+' session'+(nSess!==1?'s':'')+' · '+span+'</div></div></div>'
      +'<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px">'
        +card('Max Exit Velo',vMaxEV+' mph','best · all tests','up')
        +card('Avg Exit Velo',vAvgEV+' mph','avg · all swings','')
        +card('Hard Hit %',vHH+'%','all swings','')
      +'</div>'
      +'<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">'
        +card('Max Distance',vMaxDist+' ft','best · all sessions','up')
        +card('Avg Launch Ang',vAvgLA+'°',laOK?'In optimal 10–25°':'Target 10–25°',laOK?'up':'')
      +'</div>'
      +'<div class="section-lbl" style="margin:20px 2px 8px">Assessment History</div>'
      +'<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:11.5px;background:#141614;border:1px solid #2a2e2a;border-radius:10px">'
        +'<thead><tr style="background:rgba(131,245,44,.1);color:var(--green);font-family:\'Barlow Semi Condensed\';text-transform:uppercase;font-size:10px;letter-spacing:.4px">'
        +'<th style="padding:8px 6px;text-align:left">Block</th><th style="padding:8px 6px;text-align:left">Date</th><th style="padding:8px 6px">Max EV</th><th style="padding:8px 6px">Avg EV</th><th style="padding:8px 6px">Hard Hit</th><th style="padding:8px 6px">Max Dist</th><th style="padding:8px 6px">Avg LA</th></tr></thead>'
        +'<tbody>'+rows+'</tbody></table></div>'
      +(cs.hasTests?(
          '<div class="section-lbl" style="margin:20px 2px 8px">Swing Decisions &amp; Pitch Recognition <span style="font-weight:400;color:var(--grey);font-size:11px">· across all '+cs.testCount+' test'+(cs.testCount!==1?'s':'')+'</span></div>'
          +'<div style="display:flex;flex-wrap:wrap;gap:8px">'
            +card('Color Read',cs.colorN?((cs.colorAcc||0)+'%'):'NA',cs.colorN?(cs.colorCorrect+'/'+cs.colorN+' correct'):'No color balls',cs.colorN&&cs.colorAcc>=80?'up':'')
            +card('Swing Decisions',cs.decN?((cs.decAcc||0)+'%'):'NA',cs.decN?(cs.decCorrect+'/'+cs.decN+' correct'):'No color balls',cs.decN&&cs.decAcc>=80?'up':'')
          +'</div>'
          +'<div class="section-lbl" style="margin:16px 2px 8px">By Test Section — Correct Colors, Swing Decisions &amp; EV</div>'
          +'<div style="overflow-x:auto">'+sectionTable(cs.sections,'#141614')+'</div>'
          +reportNotes(cs)
        ):'')
      +evSection
      +'<div class="section-lbl" style="margin:20px 2px 4px">Development Summary</div>'
      +'<p style="font-size:12.5px;line-height:1.55;color:#cfcfcf;margin:2px">'+nm+' has logged '+nSess+' session'+(nSess!==1?'s':'')+' at Hitting Performance Lab'+(span?' ('+span+')':'')+'. Numbers below aggregate every completed test.</p>'
      +para('Exit Velocity', 'Best exit velocity across all tests is <b>'+vMaxEV+' mph</b>, with an average of <b>'+vAvgEV+' mph</b> across every swing'+((hasRap&&dEV!==0)?' ('+dtxt(dEV,' mph').replace(' since start','')+' on logged Rapsodo sessions)':'')+'. Closing the gap between max and average means more quality contact every swing.')
      +para('Hard Hit %', 'Hard-hit rate — swings at <b>80%+ of the hitter\'s own max exit velo</b> — is <b>'+vHH+'%</b> across all tracked swings. More hard contact means more game-quality swings.')
      +para('Distance', 'Best distance is <b>'+vMaxDist+' ft</b>. As exit velo and launch angle develop, distance follows.')
      +para('Launch Angle', 'Average launch angle sits at <b>'+vAvgLA+'°</b>'+(laOK?' — right in the optimal 10–25° window.':' — target the 10–25° line-drive window to turn exit velo into carry.'))
      +'<div style="margin-top:16px;background:rgba(131,245,44,.08);border:1px solid rgba(131,245,44,.3);border-radius:12px;padding:13px 14px">'
        +'<div style="font-family:\'Barlow Semi Condensed\';font-weight:700;font-size:13px;color:var(--green);text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px">Areas to Continue Working On</div>'
        +'<div style="font-size:12px;line-height:1.5;color:#cdeeb0">• <b>Exit velo floor</b> — close the gap between max ('+vMaxEV+') and avg ('+vAvgEV+') EV.<br>• <b>Hard-hit consistency</b> — push hard-hit rate higher by staying in the zone.<br>• <b>Launch angle</b> — keep avg LA locked in the 10–25° zone.</div></div>'
      +'<div style="text-align:center;color:var(--grey-d);font-size:10px;margin-top:16px;line-height:1.5">949 National Ave, Suite 115 · Lexington, KY 40502<br>hpllex.com · info@hpllex.com</div>'
      +'<button class="btn" style="margin-top:16px" onclick="window.print()">Save / Print PDF</button>'
      +'<div style="height:20px"></div>'
    +'</div></div>';
}

/* ================= METRIC GUIDE ================= */
function guideCard(t,measures,matters){ return '<div style="background:#141614;border:1px solid #2a2e2a;border-left:3px solid var(--green);border-radius:13px;padding:13px 14px;margin-bottom:10px">'
  +'<div style="font-family:\'Barlow Semi Condensed\';font-weight:700;font-size:15px;color:var(--green);margin-bottom:5px">'+t+'</div>'
  +'<div style="font-size:12px;line-height:1.5;color:#cfcfcf"><b style="color:#fff">What it measures:</b> '+measures+'</div>'
  +'<div style="font-size:12px;line-height:1.5;color:#cfcfcf;margin-top:5px"><b style="color:#fff">Why it matters:</b> '+matters+'</div></div>'; }
function viewInfo(){
  var p=curPlayer();
  var back=p?'go(\'profile\',{playerId:\''+p.id+'\'})':'go(\'login\')';
  return '<div class="scroll">'
    +topbar('<button class="icon-btn" onclick="'+back+'">'+IC.back+'</button>')
    +'<div class="logger-head"><h2>PARENT &amp; PLAYER <em>GUIDE</em></h2><div class="desc">We use Rapsodo technology — the same data used by college and pro programs. Here is what each number means.</div></div>'
    +'<div class="pad">'
      +guideCard('Max Exit Velocity','The fastest speed (mph) the ball left the bat during a session. Even one great swing counts.','The harder a player hits the ball, the harder it is for fielders to make plays. Scouts use exit velocity at every level.')
      +guideCard('Avg Exit Velocity','The average speed across ALL swings — not just the best ones.','Max EV shows ceiling; Avg EV shows consistency. Closing the gap means more quality contact every session.')
      +guideCard('Hard Hit %','The percentage of swings hit at 80% or more of the hitter\'s own max exit velocity — a hard-contact threshold that scales to each player.','Hard contact gives the best chance of success on every swing. Measuring against a player\'s own max means every hitter gets a fair, motivating benchmark to push higher.')
      +guideCard('Max Distance','The farthest the ball traveled (ft) on any single swing.','Distance shows how exit velo and launch angle combine into real carry. As both improve, distance follows.')
      +guideCard('Avg Launch Angle','The average angle the ball leaves the bat. Under 7° is a groundball; 10–21° is the line-drive sweet spot; 25–35° is home-run angle.','Two hitters with the same exit velo get very different results based on angle. Living in the 10–21° zone is a key to becoming a dangerous hitter.')
      +'<div style="background:rgba(131,245,44,.08);border:1px solid rgba(131,245,44,.3);border-radius:12px;padding:12px 14px;font-size:12px;line-height:1.5;color:#cdeeb0"><b style="color:#fff">Personal Best</b> — Your best session for max exit velocity is your benchmark to beat every future block.</div>'
      +'<div style="height:20px"></div>'
    +'</div></div>';
}

/* ================= ROUTER + SAFETY NET ================= */
var _lastView=null;
function render(){
  var vp=$('#vp'); var v=DB.view;
  var prevScroll=vp.querySelector?vp.querySelector('.scroll'):null;
  var sy=prevScroll?prevScroll.scrollTop:0;
  var sameView=(v===_lastView);
  try{
    var h='';
    if(v==='login') h=viewLogin();
    else if(v==='confirm') h=viewConfirm();
    else if(v==='resetSent') h=viewResetSent();
    else if(v==='newPassword') h=viewNewPassword();
    else if(v==='home') h=viewHome();
    else if(v==='roster') h=viewRoster();
    else if(v==='addToRoster') h=viewAddToRoster();
    else if(v==='coaches') h=viewCoaches();
    else if(v==='profile') h=viewProfile();
    else if(v==='editProfile') h=viewEditProfile();
    else if(v==='block') h=viewBlock();
    else if(v==='test') h=viewTest();
    else if(v==='rapsodo') h=viewRapsodo();
    else if(v==='results') h=viewResults();
    else if(v==='report') h=viewReport();
    else if(v==='info') h=viewInfo();
    else if(v==='leaderboard') h=viewLeaderboard();
    else if(v==='development') h=viewDevelopment();
    else if(v==='drillMenu') h=viewDrillMenu();
    else if(v==='drill') h=viewDrill();
    else if(v==='drillResult') h=viewDrillResult();
    else if(v==='workout') h=viewWorkout();
    else if(v==='workoutSetup') h=viewWorkoutSetup();
    else if(v==='settings') h=viewSettings();
    else if(v==='unassigned') h=viewUnassigned();
    else if(v==='facilityWoW') h=viewFacilityWoW();
    else h=viewLogin();
    vp.innerHTML=h; bindDynamic();
    var nowScroll=vp.querySelector?vp.querySelector('.scroll'):null;
    if(nowScroll) nowScroll.scrollTop = sameView ? sy : 0;
    _lastView=v;
  }catch(err){ logAppError(err,'render:'+v,true); }
}
var APP_ERRORS=[];
function logAppError(err,where,fatal){
  var rec={when:new Date().toISOString(),where:where||'',msg:(err&&err.message)||String(err),stack:(err&&err.stack)||''};
  APP_ERRORS.push(rec); try{ console.error('[HPL-HITTERS]',where,err); }catch(e){}
  if(fatal){ var vp=$('#vp'); if(vp){ vp.innerHTML='<div class="scroll"><div class="pad" style="text-align:center;padding-top:70px">'
    +'<div style="font-size:42px;margin-bottom:10px">⚾</div>'
    +'<h2 style="font-family:\'Barlow Semi Condensed\';text-transform:uppercase;letter-spacing:1px;margin:0 0 8px">Something went sideways</h2>'
    +'<div class="desc" style="max-width:290px;margin:0 auto 22px;color:var(--grey)">This screen hit a snag. Your data is safe. Try again below.</div>'
    +'<button class="btn" onclick="safeHome()">Back to Home</button>'
    +'<button class="btn ghost" style="margin-top:8px" onclick="location.reload()">Reload App</button></div></div>'; } }
}
function safeHome(){ try{ if(DB.user&&DB.user.role==='coach'){DB.view='roster';} else if(DB.user){DB.ctx.playerId=DB.user.playerId;DB.view='profile';} else {DB.view='login';} render(); }catch(e){ location.reload(); } }
if(typeof window!=='undefined'){
  window.addEventListener('error',function(e){ if(e&&e.target&&e.target!==window&&e.target.tagName){return;} logAppError((e&&e.error)||(e&&e.message)||'error','window',false); });
  window.addEventListener('unhandledrejection',function(e){ logAppError((e&&e.reason)||'rejection','promise',false); });
}

/* ================= BOOT ================= */
if(typeof SBc!=='undefined' && SBc){
  SBc.auth.onAuthStateChange(function(event){ if(event==='PASSWORD_RECOVERY'){ DB.view='newPassword'; DB.ctx={}; render(); } });
}
render();      /* paint login immediately */
cloudBoot();   /* then restore session / route by role */
</script>
