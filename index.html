<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HPL Hitters — Player Development</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,600&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0a0b0a; --panel:#141614; --panel-2:#1b1e1b; --line:#2a2e2a;
    --green:#83f52c; --green-deep:#5bc70e; --white:#fff; --grey:#9aa39a; --grey-d:#5c615c;
    --red:#e23b3b; --blue:#3d7bff; --amber:#ffb020;
    --shadow:0 18px 40px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Barlow',system-ui,sans-serif;background:#050605;color:var(--white);
    min-height:100vh;display:flex;justify-content:center;padding:22px 12px 60px}
  .display{font-family:'Anton',sans-serif;font-style:italic;text-transform:uppercase;line-height:.95}
  .cond{font-family:'Barlow Semi Condensed',sans-serif}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit}

  /* device frame */
  .device{width:392px;max-width:100%;background:var(--black);border-radius:44px;padding:12px;
    box-shadow:var(--shadow),0 0 0 2px #1c1f1c,0 0 0 10px #0c0d0c;position:relative}
  .device::before{content:"";position:absolute;top:22px;left:50%;transform:translateX(-50%);
    width:120px;height:26px;background:#000;border-radius:16px;z-index:30}
  .viewport{background:
      radial-gradient(900px 380px at 50% -12%, rgba(131,245,44,.08), transparent 60%),#080908;
    border-radius:34px;overflow:hidden;height:812px;position:relative;border:1px solid var(--line);
    display:flex;flex-direction:column}
  .scroll{flex:1;overflow-y:auto;overflow-x:hidden}
  .scroll::-webkit-scrollbar{width:0}

  /* shared header */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:40px 18px 12px;position:relative;z-index:5}
  .brand{display:flex;align-items:center;gap:9px}
  .badge{width:34px;height:34px;border-radius:50%;flex:0 0 auto;
    background:radial-gradient(circle at 50% 40%,#fff 0 42%,#0a0b0a 43% 100%);
    border:2px solid var(--green);display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px rgba(131,245,44,.4)}
  .badge span{font-family:'Anton';font-style:italic;color:var(--green-deep);font-size:15px}
  .brand h1{font-family:'Anton';font-style:italic;font-size:18px;letter-spacing:.4px}
  .brand h1 em{color:var(--green);font-style:normal}
  .hpl-logo{flex:0 0 auto;filter:drop-shadow(0 0 5px rgba(131,245,44,.45))}
  .logo-wrap{display:flex;justify-content:center;margin:0 auto 18px;filter:drop-shadow(0 0 18px rgba(131,245,44,.4))}
  .icon-btn{width:38px;height:38px;border-radius:11px;background:var(--panel);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:#fff}
  .icon-btn svg{width:18px;height:18px}
  .back{display:flex;align-items:center;gap:7px;color:#fff;font-family:'Barlow Semi Condensed';font-weight:700;
    text-transform:uppercase;letter-spacing:1px;font-size:13px}
  .back svg{width:18px;height:18px;color:var(--green)}
  .pad{padding:4px 16px 40px}

  /* login */
  .login{height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 30px;text-align:center}
  .login .logo{width:96px;height:96px;border-radius:50%;margin:0 auto 20px;
    background:radial-gradient(circle at 50% 40%,#fff 0 44%,#0a0b0a 45% 100%);border:3px solid var(--green);
    display:flex;align-items:center;justify-content:center;box-shadow:0 0 26px rgba(131,245,44,.4)}
  .login .logo span{font-family:'Anton';font-style:italic;font-size:40px;color:var(--green-deep)}
  .login h2{font-family:'Anton';font-style:italic;font-size:30px;line-height:.95}
  .login h2 em{color:var(--green);font-style:normal}
  .login p.sub{color:var(--grey);font-size:13px;margin:8px 0 26px;letter-spacing:.3px}
  .field{text-align:left;margin-bottom:14px}
  .field label{display:block;font-family:'Barlow Semi Condensed';font-weight:700;text-transform:uppercase;
    letter-spacing:1px;font-size:11px;color:var(--grey);margin-bottom:6px}
  .field input,.field select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:13px 14px;font-size:15px;color:#eef;font-weight:500}
  .field input:focus,.field select:focus{outline:none;border-color:var(--green)}
  .btn{background:linear-gradient(180deg,var(--green),var(--green-deep));color:#0a0b0a;border-radius:13px;
    padding:15px;width:100%;font-family:'Anton';font-style:italic;font-size:17px;letter-spacing:.5px;
    text-transform:uppercase;box-shadow:0 10px 22px rgba(131,245,44,.3);margin-top:6px}
  .btn.ghost{background:var(--panel);color:#fff;border:1px solid var(--line);box-shadow:none}
  .btn.sm{padding:11px;font-size:14px}
  .role-switch{display:flex;gap:8px;margin-bottom:22px;background:var(--panel);border:1px solid var(--line);
    border-radius:13px;padding:5px}
  .role-switch button{flex:1;padding:10px;border-radius:9px;font-family:'Barlow Semi Condensed';font-weight:700;
    text-transform:uppercase;letter-spacing:.5px;font-size:12px;color:var(--grey)}
  .role-switch button.on{background:var(--green);color:#0a0b0a}
  .hint{font-size:11px;color:var(--grey-d);margin-top:16px;line-height:1.5}
  .hint code{color:var(--green);background:rgba(131,245,44,.08);padding:1px 5px;border-radius:5px}

  /* sport toggle */
  .sport-toggle{display:flex;gap:8px;margin:2px 16px 4px;background:var(--panel);border:1px solid var(--line);
    border-radius:13px;padding:5px}
  .sport-toggle button{flex:1;padding:11px;border-radius:9px;font-family:'Barlow Semi Condensed';font-weight:700;
    text-transform:uppercase;letter-spacing:.6px;font-size:13px;color:var(--grey);display:flex;align-items:center;
    justify-content:center;gap:7px}
  .sport-toggle button.on{background:var(--green);color:#0a0b0a}
  .sport-toggle button svg{width:16px;height:16px}

  .hello{padding:8px 2px 6px}
  .hello p{color:var(--grey);font-size:13px;font-weight:500}
  .hello h2{font-family:'Anton';font-style:italic;font-size:25px;margin-top:2px}
  .hello h2 em{color:var(--green);font-style:normal}

  .searchbar{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);
    border-radius:13px;padding:12px 13px;margin:10px 0 6px;color:var(--grey)}
  .searchbar svg{width:16px;height:16px;flex:0 0 auto}
  .searchbar input{flex:1;background:none;border:none;color:#fff;font-size:14px}
  .searchbar input:focus{outline:none}
  .searchbar input::placeholder{color:var(--grey-d)}

  .list-head{display:flex;justify-content:space-between;align-items:baseline;margin:16px 2px 10px}
  .list-head .lbl{font-family:'Barlow Semi Condensed';font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
    font-size:12px;color:var(--grey)}
  .list-head .cnt{color:var(--green);font-weight:700;font-size:12px}

  .p-card{display:flex;align-items:center;gap:13px;background:var(--panel);border:1px solid var(--line);
    border-left:3px solid var(--green);border-radius:16px;padding:12px;margin-bottom:10px;width:100%;text-align:left}
  .p-photo{width:54px;height:54px;border-radius:13px;flex:0 0 auto;object-fit:cover;border:2px solid #303430;background:#222}
  .p-info{flex:1;min-width:0}
  .p-info h3{font-family:'Barlow Semi Condensed';font-weight:700;font-size:17px;line-height:1.1}
  .p-info .meta{color:var(--grey);font-size:12px;font-weight:500;margin-top:2px}
  .hand{width:29px;height:29px;border-radius:9px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    font-family:'Anton';font-style:italic;font-size:13px;background:rgba(131,245,44,.12);color:var(--green);
    border:1px solid rgba(131,245,44,.4)}
  .hand.sw{background:rgba(226,59,59,.12);color:#ff7b6b;border-color:rgba(226,59,59,.4)}
  .chev{color:#4a4f4a;flex:0 0 auto}

  .fab{position:absolute;bottom:80px;right:18px;width:56px;height:56px;border-radius:18px;z-index:20;
    background:linear-gradient(180deg,var(--green),var(--green-deep));color:#0a0b0a;display:flex;align-items:center;
    justify-content:center;font-family:'Anton';font-size:30px;box-shadow:0 10px 24px rgba(131,245,44,.4)}

  .tabbar{height:66px;background:#0c0e0c;border-top:1px solid var(--line);display:flex;justify-content:space-around;
    align-items:center;padding:0 6px 8px}
  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:#5a5f5a;font-size:10px;font-weight:600;
    text-transform:uppercase;letter-spacing:.5px;background:none}
  .tab svg{width:21px;height:21px}
  .tab.on{color:var(--green)}
  .lb-chips{display:flex;gap:7px;overflow-x:auto;padding:10px 16px 4px}
  .lb-chips::-webkit-scrollbar{height:0}
  .lb-chip{flex:0 0 auto;padding:8px 13px;border-radius:11px;font-family:'Barlow Semi Condensed';font-weight:700;text-transform:uppercase;letter-spacing:.5px;font-size:11.5px;color:var(--grey);background:var(--panel);border:1px solid var(--line);white-space:nowrap;cursor:pointer}
  .lb-chip.on{background:var(--green);color:#0a0b0a;border-color:var(--green)}
  .lb-cat{padding:6px 16px 2px}
  .lb-cat .t{font-family:'Anton';font-style:italic;font-size:21px}
  .lb-cat .d{color:var(--grey);font-size:12px;margin-top:2px;line-height:1.4}
  .lb-list{padding:8px 16px 4px}
  .lb-row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin-bottom:8px}
  .lb-row.me{border-color:var(--green);box-shadow:0 0 12px rgba(131,245,44,.18)}
  .lb-row .rk{font-family:'Anton';font-style:italic;font-size:20px;color:var(--grey-d);width:34px;text-align:center;flex:0 0 auto}
  .lb-row.top1 .rk{color:var(--amber)}
  .lb-row.top2 .rk,.lb-row.top3 .rk{color:#cdeeb0}
  .lb-row .nm{flex:1;font-family:'Barlow Semi Condensed';font-weight:700;font-size:16.5px}
  .lb-row .nm small{color:var(--green);font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-left:6px}
  .lb-row .vl{font-family:'Anton';font-style:italic;font-size:20px;flex:1;text-align:right}
  .lb-row .loc{flex:0 0 auto;white-space:nowrap;text-align:center;font-family:'Barlow Semi Condensed';font-weight:700;font-size:12.5px;color:var(--green);text-transform:uppercase;letter-spacing:.4px;line-height:1.15;padding:0 12px}
  .lb-row .vl small{font-size:10px;color:var(--grey);font-family:'Barlow';font-style:normal;font-weight:600}
  .lb-empty{color:var(--grey);text-align:center;font-style:italic;padding:26px 16px;font-size:13px}
  .lb-you{margin:4px 16px;background:rgba(131,245,44,.08);border:1px solid rgba(131,245,44,.3);border-radius:12px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between}
  .lb-you .l{font-family:'Barlow Semi Condensed';font-weight:700;text-transform:uppercase;letter-spacing:.6px;font-size:12px;color:var(--grey)}
  .lb-you .r{font-family:'Anton';font-style:italic;font-size:18px;color:var(--green)}
  .lb-row .nm small.ft{display:block;color:var(--grey);font-weight:600;font-size:11px;margin-top:2px;letter-spacing:0;text-transform:none}
  .lb-row .vl.up{color:var(--green)}
  .lb-row .vl.down{color:#ff7b6b}
  /* ===== home hub + drills ===== */
  .hub-hello{padding:16px 16px 0}
  .hub-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:12px 16px 16px}
  .hub-card{background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--green);border-radius:15px;padding:15px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:7px;min-height:98px}
  .hub-card svg{width:24px;height:24px;color:var(--green)}
  .hub-card h3{font-family:'Anton';font-style:italic;font-size:16px;line-height:1;margin:0}
  .hub-card p{color:var(--grey);font-size:11px;line-height:1.35;margin:0}
  .dlog{padding:6px 16px 20px}
  .dlog-q{font-family:'Barlow Semi Condensed';font-weight:700;text-transform:uppercase;letter-spacing:.6px;font-size:12px;color:var(--grey);margin:15px 0 8px}
  .dbtns{display:flex;gap:8px;flex-wrap:wrap}
  .dbtn{flex:1;min-width:66px;padding:15px 8px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);color:#fff;font-family:'Barlow Semi Condensed';font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.5px;cursor:pointer}
  .dbtn.on{background:var(--green);color:#0a0b0a;border-color:var(--green)}
  .dbtn.fb.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .dbtn.cb.on{background:var(--amber);border-color:var(--amber);color:#0a0b0a}
  .dbtn.bad.on{background:var(--red);border-color:var(--red);color:#fff}
  .dgrid7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .dgrid7 .dbtn{min-width:0;padding:14px 0;font-family:'Anton';font-style:italic;font-size:18px}
  .dev-in{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:13px 12px;color:#fff;font-size:17px;font-weight:700}
  .dev-in:focus{outline:none;border-color:var(--green)}
  .dtally{display:flex;gap:8px;padding:8px 0 2px}
  .dtally .tc{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px 6px;text-align:center}
  .dtally .tc .n{font-family:'Anton';font-style:italic;font-size:20px}
  .dtally .tc .l{font-size:9px;text-transform:uppercase;letter-spacing:.4px;color:var(--grey);font-weight:700;margin-top:2px}
  .dprog{font-size:12.5px;color:var(--grey);text-align:center;margin:10px 0 2px}
  .dprog b{color:var(--green)}
  .plist{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .pchip{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);font-size:11px;font-weight:700;color:var(--grey)}
  .pchip.good{border-color:rgba(131,245,44,.5);color:var(--green)}
  .pchip.bad{border-color:rgba(226,59,59,.5);color:#ff7b6b}
  .sport-toggle{display:flex;gap:8px;margin:10px 16px 2px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px}
  .sport-toggle button{flex:1;padding:11px;border-radius:9px;font-family:'Barlow Semi Condensed';font-weight:700;text-transform:uppercase;letter-spacing:.5px;font-size:13px;color:var(--grey);background:none;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
  .sport-toggle button.on{background:var(--green);color:#0a0b0a}
  .sport-toggle button svg{width:16px;height:16px}
  .fac-ic{width:54px;height:54px;border-radius:13px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:rgba(131,245,44,.1);border:1px solid rgba(131,245,44,.3);color:var(--green)}
  .fac-ic svg{width:26px;height:26px}
  .add-row{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:9px 11px;margin-bottom:8px;width:100%;text-align:left;cursor:pointer}
  .add-row.on{border-color:var(--green);background:rgba(131,245,44,.06)}
  .add-row .p-info h3{font-size:16px}
  .chk{width:24px;height:24px;flex:0 0 auto;border-radius:7px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:#0a0b0a;font-size:14px;font-weight:900;background:var(--panel-2)}
  .chk.on{background:var(--green);border-color:var(--green)}
  .wk-area{margin:12px 16px 0;background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden}
  .wk-area .wk-hd{display:flex;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid var(--line)}
  .wk-area .wk-hd .n{width:26px;height:26px;border-radius:8px;background:rgba(131,245,44,.12);border:1px solid rgba(131,245,44,.3);color:var(--green);display:flex;align-items:center;justify-content:center;font-family:'Anton';font-style:italic;font-size:14px;flex:0 0 auto}
  .wk-area .wk-hd h4{flex:1;font-family:'Barlow Semi Condensed';font-weight:700;text-transform:uppercase;letter-spacing:.5px;font-size:14px}
  .wk-area .wk-hd .ef{font-size:10.5px;color:var(--grey);font-weight:600}
  .wk-area .wk-bd{padding:11px 14px}
  .wk-pelo{display:flex;align-items:center;gap:8px;background:rgba(61,123,255,.08);border:1px solid rgba(61,123,255,.3);border-radius:10px;padding:9px 11px;font-size:12.5px;color:#9db8ff;font-weight:600;margin-bottom:8px}
  .wk-pelo svg{width:15px;height:15px;flex:0 0 auto}
  .wk-drill{display:inline-flex;align-items:center;gap:6px;margin:0 6px 6px 0;padding:8px 11px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);color:#fff;font-family:'Barlow Semi Condensed';font-weight:700;font-size:13.5px;cursor:default}
  .wk-drill.has-cue{cursor:pointer;border-color:rgba(131,245,44,.35)}
  .wk-drill.sec{border-left:3px solid var(--amber)}
  .wk-drill.need{background:rgba(131,245,44,.1);border-color:var(--green);color:var(--green)}
  .wk-drill.bs{border:1.5px solid var(--green);background:rgba(131,245,44,.17);color:#eafff0}
  .wk-drill.addon{border:1.5px solid var(--amber);background:rgba(255,176,32,.17);color:#fff2d8}
  .wk-drill .dtag{font-size:8.5px;font-weight:800;letter-spacing:.5px;padding:2px 5px;border-radius:4px;text-transform:uppercase;line-height:1}
  .wk-drill .dtag.bs{background:var(--green);color:#0a0b0a}
  .wk-drill .dtag.add{background:var(--amber);color:#241a00}
  .wk-drill .drep{font-size:10px;opacity:.6;font-weight:600;white-space:nowrap}
  .wk-drill .ci{width:15px;height:15px;border-radius:50%;background:var(--green);color:#0a0b0a;font-size:9px;font-style:italic;font-family:'Anton';display:inline-flex;align-items:center;justify-content:center}
  .wk-flag{font-size:11.5px;color:#f0d9a8;font-style:italic;margin-top:6px;line-height:1.4}
  .wk-mind{margin:10px 0 0;background:rgba(61,123,255,.08);border:1px solid rgba(61,123,255,.3);border-radius:11px;padding:11px 13px;color:#9db8ff;font-weight:700;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:8px;width:100%;text-align:left}
  .wk-mind svg{width:16px;height:16px;flex:0 0 auto}
  .wk-modal{position:fixed;inset:0;z-index:80;background:rgba(6,7,6,.86);display:none;align-items:center;justify-content:center;padding:24px}
  .wk-modal-card{background:var(--panel);border:1px solid var(--green);border-radius:16px;padding:20px;max-width:340px}
  .wk-modal-card h3{font-family:'Anton';font-style:italic;font-size:20px;margin-bottom:10px}
  .wk-modal-card p{font-size:14px;line-height:1.55;color:#d6e8c8;margin-bottom:16px}
  .wk-choose{display:flex;flex-direction:column;gap:12px;padding:8px 16px}
  .wk-cbtn{padding:20px;border-radius:15px;font-family:'Anton';font-style:italic;font-size:22px;text-align:center;cursor:pointer;border:1px solid var(--line);letter-spacing:.5px}
  .wk-cbtn.bs{background:linear-gradient(180deg,var(--green),var(--green-deep));color:#0a0b0a;border-color:var(--green)}
  .wk-cbtn.bs.off{background:var(--panel);color:var(--grey-d);border-color:var(--line);cursor:not-allowed}
  .wk-cbtn.no{background:var(--panel);color:#fff}
  .wk-cbtn .sub{display:block;font-family:'Barlow';font-style:normal;font-size:12px;font-weight:600;margin-top:6px;text-transform:none;letter-spacing:0;line-height:1.4}
  .wk-cbtn.bs .sub{color:#0a3d0a}
  .wk-cbtn.bs.off .sub{color:var(--grey)}
  .wk-cbtn.no .sub{color:var(--grey)}
  .wk-empty{margin:20px 16px;padding:22px;text-align:center;color:var(--grey);font-style:italic;background:var(--panel);border:1px solid var(--line);border-radius:14px;line-height:1.5}

  /* profile */
  .prof-hero{text-align:center;padding:6px 16px 0}
  .prof-photo-wrap{position:relative;width:132px;height:132px;margin:2px auto 0}
  .prof-photo{width:132px;height:132px;border-radius:24px;object-fit:cover;border:3px solid var(--green);
    box-shadow:0 0 0 5px #0a0b0a,0 0 24px rgba(131,245,44,.3)}
  .prof-hand{position:absolute;bottom:-8px;right:6px;width:38px;height:38px;border-radius:12px;display:flex;
    align-items:center;justify-content:center;font-family:'Anton';font-style:italic;font-size:17px;
    background:linear-gradient(180deg,var(--green),var(--green-deep));color:#0a0b0a;border:3px solid #0a0b0a}
  .prof-name{font-family:'Anton';font-style:italic;font-size:27px;margin-top:14px;line-height:1}
  .prof-name em{color:var(--green);font-style:normal}
  .prof-sub{color:var(--grey);font-family:'Barlow Semi Condensed';font-weight:600;letter-spacing:.8px;
    text-transform:uppercase;font-size:12px;margin-top:6px}
  .prof-sub .dot{color:var(--green);margin:0 5px}
  .stat-row{display:flex;gap:9px;padding:16px 16px 2px}
  .stat{flex:1;background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--green);border-radius:13px;
    padding:11px 6px;text-align:center}
  .stat .k{font-family:'Barlow Semi Condensed';font-weight:600;color:var(--grey);text-transform:uppercase;
    letter-spacing:.6px;font-size:9.5px}
  .stat .v{font-family:'Anton';font-style:italic;font-size:19px;margin-top:4px}
  .stat .v small{font-size:10px;color:var(--grey);font-family:'Barlow';font-style:normal;font-weight:600}

  .detail-card{margin:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden}
  .detail-card .row{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;border-bottom:1px solid var(--line)}
  .detail-card .row:last-child{border-bottom:none}
  .detail-card .row .k{color:var(--grey);font-size:13px;font-weight:500;display:flex;align-items:center;gap:9px}
  .detail-card .row .k svg{width:16px;height:16px;color:var(--green)}
  .detail-card .row .v{font-family:'Barlow Semi Condensed';font-weight:700;font-size:15px}
  .join{text-align:center;font-style:italic;color:var(--grey);font-size:12.5px;margin:2px 16px 0}
  .join b{color:#c8ccc8;font-weight:600}

  .section-lbl{font-family:'Barlow Semi Condensed';font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
    font-size:12px;color:var(--grey);margin:22px 18px 10px;display:flex;justify-content:space-between;align-items:center}
  .section-lbl .link{color:var(--green);font-size:11px}

  /* assessment timeline */
  .assess{display:flex;gap:9px;overflow-x:auto;padding:0 16px 4px}
  .assess::-webkit-scrollbar{height:0}
  .assess .a{flex:0 0 auto;width:96px;background:var(--panel);border:1px solid var(--line);border-radius:13px;
    padding:11px 10px;text-align:center}
  .assess .a.cur{border-color:var(--green);box-shadow:0 0 14px rgba(131,245,44,.2)}
  .assess .a .wk{font-family:'Anton';font-style:italic;font-size:15px}
  .assess .a .dt{color:var(--grey);font-size:10px;margin-top:2px}
  .assess .a .ev{color:var(--green);font-weight:700;font-size:12px;margin-top:6px}
  /* 4-week block carousel */
  .block-carousel{display:flex;align-items:stretch;gap:6px;padding:0 12px}
  .bc-nav{flex:0 0 auto;width:34px;background:var(--panel);border:1px solid var(--line);border-radius:11px;
    color:var(--green);display:flex;align-items:center;justify-content:center}
  .bc-nav:disabled{opacity:.3;color:var(--grey-d)}
  .bc-nav svg{width:16px;height:16px}
  .assess.blk-strip{flex:1;padding:0;overflow:visible}
  .assess .a.blk{width:auto;flex:1 1 0;min-width:0;padding:13px 4px}
  .assess .a.blk .wk{font-family:'Barlow Semi Condensed';font-weight:700;font-size:12px;letter-spacing:.5px;color:var(--grey)}
  .assess .a.blk .blk-lbl{font-family:'Anton';font-style:italic;font-size:22px;color:#fff;margin-top:2px;white-space:nowrap}
  .assess .a.blk.empty{opacity:.5}
  .assess .a.blk.empty .ev{color:var(--grey-d)}

  /* drill list on profile */
  .drill-card{margin:0 16px 11px;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px;width:calc(100% - 32px);text-align:left;display:block}
  .drill-card .dc-top{display:flex;align-items:center;gap:11px}
  .dc-ic{width:40px;height:40px;border-radius:11px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    background:rgba(131,245,44,.1);border:1px solid rgba(131,245,44,.3);color:var(--green);font-family:'Anton';font-style:italic;font-size:16px}
  .dc-name{flex:1}
  .dc-name h4{font-family:'Barlow Semi Condensed';font-weight:700;font-size:16px}
  .dc-name .st{font-size:11.5px;color:var(--grey);margin-top:1px}
  .lvl-badge{font-family:'Barlow Semi Condensed';font-weight:700;font-size:11px;text-transform:uppercase;
    letter-spacing:.5px;padding:4px 9px;border-radius:8px;background:var(--panel-2);color:var(--grey);border:1px solid var(--line)}
  .lvl-badge.l1{background:rgba(61,123,255,.14);color:#7ea8ff;border-color:rgba(61,123,255,.4)}
  .lvl-badge.l2{background:rgba(131,245,44,.14);color:var(--green);border-color:rgba(131,245,44,.4)}
  .lvl-badge.done{background:rgba(255,176,32,.14);color:var(--amber);border-color:rgba(255,176,32,.4)}
  .lvl-badge.locked{background:#191b19;color:#5c615c;border-color:var(--line);display:inline-flex;align-items:center;gap:3px}
  .lvl-badge.locked svg{width:11px;height:11px}
  .lv-tags{display:flex;flex-direction:column;gap:4px;align-items:flex-end;flex:0 0 auto}
  .wk-note{margin:2px 16px 4px;font-size:11.5px;color:var(--grey);font-style:italic}
  .wk-note b{color:var(--green);font-style:normal}
  .assess .a{cursor:pointer;background:var(--panel);border:1px solid var(--line)}
  .prog{height:6px;border-radius:4px;background:#22261f;margin-top:11px;overflow:hidden}
  .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--green-deep),var(--green));border-radius:4px}
  .prog-txt{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--grey)}
  .prog-txt b{color:#fff}

  /* drill logger */
  .logger-head{padding:2px 16px 6px}
  .logger-head h2{font-family:'Anton';font-style:italic;font-size:23px;line-height:1}
  .logger-head h2 em{color:var(--green);font-style:normal}
  .logger-head .desc{color:var(--grey);font-size:12.5px;margin-top:6px;line-height:1.45}
  .subtabs{display:flex;gap:7px;margin:12px 16px 6px}
  .subtabs button{flex:1;padding:9px;border-radius:10px;font-family:'Barlow Semi Condensed';font-weight:700;
    text-transform:uppercase;letter-spacing:.5px;font-size:11.5px;color:var(--grey);background:var(--panel);border:1px solid var(--line)}
  .subtabs button.on{background:var(--green);color:#0a0b0a;border-color:var(--green)}

  .score-strip{display:flex;gap:8px;padding:8px 16px 4px}
  .score-strip .sc{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 6px;text-align:center}
  .score-strip .sc.pass{border-color:var(--green);box-shadow:0 0 12px rgba(131,245,44,.18)}
  .score-strip .sc.fail{border-color:rgba(226,59,59,.5)}
  .score-strip .sc .k{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--grey);font-weight:600}
  .score-strip .sc .v{font-family:'Anton';font-style:italic;font-size:20px;margin-top:2px}
  .score-strip .sc.pass .v{color:var(--green)}
  .score-strip .sc.fail .v{color:#ff7b6b}

  .swing-list{padding:8px 16px 20px}
  .swing{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:11px 12px;margin-bottom:9px}
  .swing.correct{border-left:3px solid var(--green)}
  .swing.wrong{border-left:3px solid var(--red)}
  .swing.empty{border-left:3px solid var(--line)}
  .swing .sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
  .swing .sh .n{font-family:'Barlow Semi Condensed';font-weight:700;font-size:13px;color:var(--grey);text-transform:uppercase;letter-spacing:.5px}
  .swing .sh .tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:3px 8px;border-radius:7px}
  .swing .sh .tag.ok{background:rgba(131,245,44,.16);color:var(--green)}
  .swing .sh .tag.no{background:rgba(226,59,59,.16);color:#ff7b6b}
  .swing .sh .tag.round{background:var(--panel-2);color:var(--grey);border:1px solid var(--line)}
  .swing .lab{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--grey-d);font-weight:700;margin:6px 0 5px}
  .segrow{display:flex;flex-wrap:wrap;gap:6px}
  .seg{padding:8px 0;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);color:var(--grey);
    font-family:'Barlow Semi Condensed';font-weight:700;font-size:13px;text-align:center;flex:1;min-width:38px}
  .seg.on{background:var(--green);color:#0a0b0a;border-color:var(--green)}
  .seg.big{font-family:'Anton';font-style:italic;font-size:15px;padding:10px 0}
  /* color chips */
  .seg.c-red.on{background:var(--red);border-color:var(--red);color:#fff}
  .seg.c-green.on{background:#37c837;border-color:#37c837;color:#062}
  .seg.c-black.on{background:#000;border-color:#666;color:#fff}
  .seg.c-blue.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .seg.swing-y.on{background:var(--green);border-color:var(--green);color:#0a0b0a}
  .seg.take-n.on{background:var(--amber);border-color:var(--amber);color:#0a0b0a}
  .numrow{display:flex;gap:8px;align-items:center;margin-top:4px}
  .numrow input{flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;
    color:#fff;font-size:15px;font-weight:600;width:100%}
  .numrow input:focus{outline:none;border-color:var(--green)}
  .numrow .u{font-size:11px;color:var(--grey);font-weight:600}

  /* analysis */
  .analysis{margin:6px 16px 16px;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px}
  .analysis h4{font-family:'Barlow Semi Condensed';font-weight:700;text-transform:uppercase;letter-spacing:1px;
    font-size:12px;color:var(--grey);margin-bottom:12px}
  .amx{display:flex;flex-direction:column;gap:9px}
  .amx .arow{display:flex;align-items:center;gap:10px}
  .amx .arow .cl{width:66px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:7px}
  .amx .arow .dot{width:13px;height:13px;border-radius:4px;flex:0 0 auto;border:1px solid #0004}
  .amx .arow .bar{flex:1;height:9px;background:#22261f;border-radius:5px;overflow:hidden}
  .amx .arow .bar i{display:block;height:100%;border-radius:5px}
  .amx .arow .pc{width:56px;text-align:right;font-size:11px;color:var(--grey);font-weight:600}
  .amx .arow .pc b{color:#fff}
  .insight{margin:0 16px 16px;border-radius:13px;padding:12px 14px;font-size:12.5px;line-height:1.5;
    background:rgba(255,176,32,.08);border:1px solid rgba(255,176,32,.3);color:#f0d9a8}
  .insight.good{background:rgba(131,245,44,.08);border-color:rgba(131,245,44,.3);color:#cdeeb0}
  .insight b{color:#fff}

  /* objective banner */
  .objective{margin:8px 16px 4px;background:rgba(131,245,44,.07);border:1px solid rgba(131,245,44,.28);
    border-radius:13px;padding:11px 13px;display:flex;gap:11px;align-items:flex-start}
  .objective .badge-n{flex:0 0 auto;min-width:44px;text-align:center;background:var(--green);color:#0a0b0a;
    border-radius:9px;padding:6px 4px}
  .objective .badge-n .num{font-family:'Anton';font-style:italic;font-size:20px;line-height:1}
  .objective .badge-n .u2{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
  .objective .otxt{font-size:12.5px;line-height:1.45;color:#d6e8c8}
  .objective .otxt b{color:#fff}

  /* live scoring chart pills */
  .chart-wrap{margin:8px 16px 2px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:11px 12px}
  .chart-lbl{font-family:'Barlow Semi Condensed';font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
    font-size:10.5px;color:var(--grey);margin-bottom:9px;display:flex;justify-content:space-between}
  .chart-lbl b{color:var(--green)}
  .pills{display:flex;flex-wrap:wrap;gap:6px}
  .pill{width:30px;height:30px;border-radius:8px;font-family:'Anton';font-style:italic;font-size:13px;
    display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--panel-2);color:var(--grey)}
  .pill.p-ok{background:rgba(131,245,44,.9);color:#0a0b0a;border-color:var(--green)}
  .pill.p-no{background:rgba(226,59,59,.9);color:#fff;border-color:var(--red)}
  .pill.p-none{background:var(--panel-2);color:#4a4f4a}

  /* quick-entry buttons */
  .seg.ok-quick{background:rgba(131,245,44,.16);border:1px solid var(--green);color:var(--green);
    font-family:'Barlow Semi Condensed';font-weight:700;flex:0 0 auto;padding:8px 14px}
  .swing .sh .tag{cursor:pointer;border:none}
  .mini-correct{color:var(--green);font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.4px;
    background:rgba(131,245,44,.14);border:1px solid rgba(131,245,44,.4);border-radius:6px;padding:2px 7px}
  .miss-note{font-size:11px;color:#f0b7b0;margin:2px 0 6px 74px;font-style:italic}

  /* rapsodo cloud integration */
  .rap-cloud{margin:8px 16px 2px;background:rgba(61,123,255,.08);border:1px solid rgba(61,123,255,.35);
    border-radius:13px;padding:12px 13px}
  .rap-cloud .rc-top{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .rap-cloud .rc-dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
  .rap-cloud .rc-top .t{font-family:'Barlow Semi Condensed';font-weight:700;font-size:13px}
  .rap-cloud .rc-top .t b{color:#7ea8ff}
  .rap-cloud .rc-sub{font-size:11px;color:var(--grey);margin-bottom:10px}
  .rap-pull{width:100%;background:linear-gradient(180deg,#4d86ff,#2f63e0);color:#fff;border-radius:11px;padding:12px;
    font-family:'Barlow Semi Condensed';font-weight:700;text-transform:uppercase;letter-spacing:.6px;font-size:13px;
    display:flex;align-items:center;justify-content:center;gap:8px}
  .rap-pull svg{width:16px;height:16px}
  .rap-pull.done{background:var(--panel);border:1px solid var(--green);color:var(--green)}

  /* ===== level-up celebration ===== */
  .reward{position:absolute;inset:0;z-index:50;overflow:hidden;
    background:radial-gradient(120% 80% at 50% 15%, rgba(131,245,44,.22), rgba(8,9,8,.98) 60%), #060706;
    display:flex;align-items:center;justify-content:center}
  .rw-confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .cf{position:absolute;top:-20px;border-radius:2px;opacity:.95;animation:cf-fall linear forwards}
  @keyframes cf-fall{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(860px) rotate(540deg)}}
  .rw-inner{position:relative;text-align:center;padding:0 26px;width:100%}
  .rw-burst{width:120px;height:120px;margin:0 auto 6px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle, rgba(131,245,44,.35), transparent 70%);animation:rw-pop .6s cubic-bezier(.2,1.5,.4,1) both, rw-spin 6s linear 1s infinite}
  @keyframes rw-pop{0%{transform:scale(0)}100%{transform:scale(1)}}
  @keyframes rw-spin{to{transform:rotate(360deg)}}
  .rw-great{font-family:'Anton';font-style:italic;font-size:44px;line-height:.95;color:#fff;
    text-shadow:0 0 18px rgba(131,245,44,.6);animation:rw-drop .5s .15s both}
  @keyframes rw-drop{0%{transform:translateY(-30px) scale(.6);opacity:0}70%{transform:translateY(6px) scale(1.05)}100%{transform:translateY(0) scale(1);opacity:1}}
  .rw-sub{color:#cdeeb0;font-size:14px;margin-top:8px;animation:rw-fade .6s .5s both}
  .rw-sub b{color:var(--green)}
  @keyframes rw-fade{from{opacity:0}to{opacity:1}}
  .rw-stars{margin:16px 0 6px;display:flex;justify-content:center;gap:10px}
  .rw-star{font-size:40px;color:#2c3327;animation:rw-star-pop .4s both}
  .rw-star.lit{color:var(--amber);text-shadow:0 0 16px rgba(255,176,32,.8)}
  @keyframes rw-star-pop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.3)}100%{transform:scale(1) rotate(0)}}
  .rw-unlock{display:flex;align-items:center;justify-content:center;gap:12px;margin:20px auto 4px;
    background:rgba(131,245,44,.1);border:1.5px solid var(--green);border-radius:16px;padding:14px 20px;max-width:290px;
    animation:rw-unlock-in .5s 1s both}
  @keyframes rw-unlock-in{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
  .rw-lock{color:var(--green);animation:rw-shake .5s 1.4s 2}
  .rw-lock svg{width:30px;height:30px}
  @keyframes rw-shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
  .rw-unlock-txt{text-align:left;line-height:1}
  .rw-unlock-txt span{display:block;font-family:'Barlow Semi Condensed';font-weight:700;color:var(--grey);font-size:13px;letter-spacing:1px}
  .rw-unlock-txt b{font-family:'Anton';font-style:italic;font-size:26px;color:var(--green);letter-spacing:.5px}
  .rw-levelbar{display:flex;align-items:center;gap:8px;max-width:290px;margin:18px auto 0;animation:rw-fade .5s 1.3s both}
  .rw-l{font-family:'Barlow Semi Condensed';font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px;
    padding:5px 8px;border-radius:8px;white-space:nowrap}
  .rw-l.l-done{background:rgba(255,176,32,.16);color:var(--amber)}
  .rw-l.l-next{background:rgba(131,245,44,.16);color:var(--green)}
  .rw-track{flex:1;height:8px;background:#22261f;border-radius:5px;overflow:hidden}
  .rw-track i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--green));border-radius:5px;
    animation:rw-fill 1.1s 1.5s forwards}
  @keyframes rw-fill{to{width:100%}}
  .rw-btn{margin:26px auto 0;display:block;background:linear-gradient(180deg,var(--green),var(--green-deep));color:#0a0b0a;
    border-radius:16px;padding:16px 34px;font-family:'Anton';font-style:italic;font-size:19px;letter-spacing:.5px;
    box-shadow:0 10px 26px rgba(131,245,44,.4);animation:rw-fade .5s 1.7s both, rw-bob 1.6s 2.2s ease-in-out infinite}
  @keyframes rw-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .rw-tag{margin-top:18px;font-family:'Barlow Semi Condensed';font-weight:700;letter-spacing:1.5px;font-size:10px;
    color:var(--grey-d);text-transform:uppercase;animation:rw-fade .5s 2s both}

  .save-bar{padding:10px 16px 16px}

  /* parent progress cards */
  .pp-card{margin:0 16px 12px;background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden}
  .pp-card .ph{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:1px solid var(--line)}
  .pp-card .ph h4{font-family:'Barlow Semi Condensed';font-weight:700;font-size:15px}
  .pp-card .pb{padding:13px 15px;display:flex;gap:16px;flex-wrap:wrap}
  .pp-metric{min-width:70px}
  .pp-metric .k{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--grey);font-weight:600}
  .pp-metric .v{font-family:'Anton';font-style:italic;font-size:20px;margin-top:2px}
  .pp-metric .v.up{color:var(--green)}
  .delta{font-size:11px;font-weight:700;margin-left:5px}
  .delta.up{color:var(--green)} .delta.down{color:#ff7b6b}

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);z-index:200;pointer-events:none;
    background:var(--green);color:#0a0b0a;font-family:'Barlow Semi Condensed';font-weight:700;padding:12px 20px;
    border-radius:12px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:transform .3s,opacity .3s;white-space:nowrap;
    opacity:0;visibility:hidden}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
  .muted{color:var(--grey);font-size:12px}
  .center-note{text-align:center;color:var(--grey-d);font-size:12px;padding:30px 20px}

  /* rapsodo profile numbers */
  .rap-numbers{margin:2px 16px 10px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .rn{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px 13px}
  .rn .k{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--grey);font-weight:600}
  .rn .v{font-family:'Anton';font-style:italic;font-size:24px;color:var(--green);margin-top:3px;line-height:1}
  .rn .v small{font-size:12px;color:var(--grey);font-style:normal;font-family:'Barlow Semi Condensed'}
  .rn input{width:100%;margin-top:5px;background:#0c0d0c;border:1px solid var(--line);border-radius:8px;color:#fff;padding:8px 9px;font-size:16px}
  .btn.ghost{background:var(--panel);color:var(--grey);border:1px solid var(--line);box-shadow:none}

  /* consent + waiver */
  .consent-box{display:flex;gap:10px;align-items:flex-start;margin:6px 0 2px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 13px;text-align:left}
  .consent-box input{width:20px;height:20px;flex-shrink:0;accent-color:var(--green);margin-top:1px}
  .consent-box label{font-size:12px;color:var(--grey);line-height:1.45}
  .consent-box a{color:var(--green);text-decoration:underline;cursor:pointer}
  .waiver-modal{position:fixed;inset:0;z-index:70;background:rgba(4,5,4,.96);display:flex;flex-direction:column;padding:18px 15px;max-width:430px;margin:0 auto}
  .waiver-modal .wm-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 17px;overflow-y:auto;flex:1;text-align:left}
  .waiver-modal h3{font-family:'Anton';font-style:italic;font-size:22px;margin-bottom:4px;color:#fff}
  .waiver-modal .wm-meta{font-size:11px;color:var(--grey-d);margin-bottom:10px}
  .waiver-modal h4{font-family:'Barlow Semi Condensed';font-weight:700;font-size:13.5px;margin:14px 0 4px;color:var(--green);text-transform:uppercase;letter-spacing:.4px}
  .waiver-modal p{font-size:12.5px;color:#cfcfcf;line-height:1.55;margin-bottom:8px}

  /* ==========================================================
     DESKTOP / LAPTOP LAYOUT — fill the screen (phone frame only on phones)
     ========================================================== */
  @media (min-width:900px){
    body{padding:0;display:block;background:
      radial-gradient(1400px 620px at 50% -12%, rgba(131,245,44,.05), transparent 60%), #050605;}
    .device{width:100%;max-width:100%;height:100vh;border-radius:0;padding:0;box-shadow:none;background:transparent}
    .device::before{display:none}                 /* hide the phone notch */
    .viewport{height:100vh;border-radius:0;border:none;
      background:radial-gradient(1500px 560px at 50% -12%, rgba(131,245,44,.06), transparent 55%), #080908}

    /* center all content in a wide, comfortable column */
    :root{--maxw:1180px}
    .topbar{padding:22px max(24px, calc((100% - var(--maxw))/2)) 14px}
    .scroll{padding-left:max(24px, calc((100% - var(--maxw))/2));
            padding-right:max(24px, calc((100% - var(--maxw))/2))}
    .pad{padding-left:0;padding-right:0}
    /* neutralize the fixed 16px side margins so the centered column governs width */
    .sport-toggle,.stat-row,.detail-card,.drill-card,.section-lbl,.rap-numbers,.assess,
    .wk-note,.prof-hero,.hello,.searchbar,.list-head,.join,.pp-card,.rap-cloud,.score-strip,
    .save-bar,.logger-head,.miss,.numrow{margin-left:0;margin-right:0}
    .drill-card{width:100%}

    /* roster becomes a responsive multi-column grid */
    #rosterList{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
    #rosterList .p-card{margin-bottom:0}

    /* rapsodo numbers: 4 across on desktop */
    .rap-numbers{grid-template-columns:repeat(4,1fr)}

    /* profile hero + detail: two-column feel on wide screens */
    .stat-row{gap:14px}
    .detail-card{max-width:none}

    /* bottom nav spans the same column, tabs left-aligned like a web app */
    .tabbar{padding-left:max(24px, calc((100% - var(--maxw))/2));
            padding-right:max(24px, calc((100% - var(--maxw))/2));
            justify-content:flex-start;gap:6px}
    .tab{max-width:none;flex:1 1 0;min-width:0;padding:0 5px}
    .tab span{white-space:normal;line-height:1.05;text-align:center;word-break:break-word}

    /* keep login + add-forms readable, not stretched */
    .login{max-width:460px;margin:0 auto}
    .logger-head{max-width:760px}
  }

  /* extra-wide screens: let drill loggers breathe in two columns */
  @media (min-width:1200px){
    .swing-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  }
</style>

function rapsodoStats(swings){ // swings: [{ev,dist}]
  const evs=swings.filter(s=>s.ev>0).map(s=>s.ev);

    avgDist: ds.length? Math.round(ds.reduce((a,b)=>a+b,0)/ds.length):0,

function logoSVG(size){
  return `<img class="hpl-logo" src="${HPL_LOGO_URL}" alt="HPL" onclick="goHome()" style="cursor:pointer;height:${size}px;width:auto;max-width:${Math.round(size*2.4)}px;object-fit:contain">`;
}
function goHome(){
  if(DB.user&&DB.user.role==='coach'){ go('home'); }
  else if(DB.user){ var mine=(DB.players||[]).filter(function(p){return p.owner===DB.user.id;})[0]||(DB.players||[])[0]; if(mine){ go('profile',{playerId:mine.id}); } else { go('roster'); } }
  else { go('login'); }
}

var LS='hpl_hitters_v2';
function nid(){ return 'h'+Math.random().toString(36).slice(2,9); }
function ageFrom(iso){ if(!iso) return ''; const b=new Date(iso), n=new Date(); if(isNaN(b)) return ''; let a=n.getFullYear()-b.getFullYear(); const m=n.getMonth()-b.getMonth(); if(m<0||(m===0&&n.getDate()<b.getDate()))a--; return a>0?a:''; }
var POSITIONS=['P','C','1B','2B','3B','SS','LF','CF','RF','OF','DH','UTIL'];
var BLOCK_LABELS=['Weeks 1–5','Weeks 6–10','Weeks 11–15','Weeks 16–20','Weeks 21–25'];
function emptyRap(){ return {maxEV:0,avgEV:0,maxDist:0,avgDist:0,avgLA:0,hardHitPct:0}; }
function emptyBlocks(){ return BLOCK_LABELS.map(function(l,i){ return {n:i+1,label:l,date:null,entries:[]}; }); }
/* session accessors (each block holds many dated entries: hitting tests + rapsodo) */
function blockEntries(b){ return (b&&b.entries)||[]; }
function lastRap(b){ var r=null; blockEntries(b).forEach(function(e){ if(e.type==='rapsodo') r=e; }); return r; }
function lastTest(b){ var t=null; blockEntries(b).forEach(function(e){ if(e.type==='test'&&e.status!=='inprogress') t=e; }); return t; }
function entryById(b,id){ return blockEntries(b).filter(function(e){return e.id===id;})[0]; }

var DB={ view:'login', ctx:{}, user:null, players:[], coaches:[], search:'', sport:'baseball', facility:'' };
function persist(){ /* cloud writes happen in savePlayer(); local no-op */ }
async function loadPlayers(){
  DB.players=[];
  if(!SBc) return;
  try{
    var res=await SBc.from('hitters').select('id,owner,state').order('created_at',{ascending:true});
    if(res.error){ console.warn(res.error); return; }
    DB.players=(res.data||[]).map(function(r){ return Object.assign({}, r.state||{}, {id:r.id, owner:r.owner}); });
  }catch(e){ console.warn(e); }
  try{ var fe=await SBc.from('hitters_facility').select('facility,equip'); if(fe&&fe.data){ FAC_EQUIP={}; fe.data.forEach(function(row){ FAC_EQUIP[row.facility]=row.equip||{}; }); } }catch(e){ console.warn(e); }
}
async function savePlayer(p){
  if(!SBc||!p) return;
  var state=Object.assign({}, p); delete state.id; delete state.owner;
  var row={ id:p.id, first_name:p.first||null, last_name:p.last||null, position:p.position||null, grad_class:p.gradClass||null, state:state, updated_at:new Date().toISOString() };
  if(p.owner) row.owner=p.owner;
  try{ var res=await SBc.from('hitters').upsert(row); if(res.error){ console.warn(res.error); toast('Save failed: '+(res.error.message||'')); } }
  catch(e){ console.warn(e); toast('Save failed'); }
}
async function ensureAccount(user){
  var acc=null;
  try{ var r=await SBc.from('hitter_accounts').select('role,name,email,hitter_id').eq('id',user.id).maybeSingle(); acc=r.data; }catch(e){}
  if(acc) return acc;
  var meta=user.user_metadata||{};
  var name=meta.full_name||user.email;
  var role='player';
  try{ await SBc.from('hitter_accounts').insert({id:user.id, role:'player', name:name, email:user.email}); }catch(e){ console.warn('acc',e); }
  if(meta.role==='coach' && meta.coach_code){
    try{ var rc=await SBc.rpc('claim_coach',{p_code:meta.coach_code}); if(rc && !rc.error && rc.data==='coach'){ role='coach'; } else { toast('Invalid coach code — added as a player'); } }catch(e){ console.warn('claim',e); }
  }
  if(role==='player'){
    var parts=String(name||'').split(' ');
    var st={ first:parts[0]||name, last:parts.slice(1).join(' '), sport:(meta.sport==='softball'?'softball':'baseball'), photo:null, birthdate:'', height:'', weight:'', position:'', gradClass:'', hand:'R', gripRH:'', gripLH:'', rap:emptyRap(), blocks:emptyBlocks() };
    try{ var hr=await SBc.from('hitters').insert({owner:user.id, first_name:st.first, last_name:st.last, state:st}).select('id').single();
      if(hr.data){ try{ await SBc.from('hitter_accounts').update({hitter_id:hr.data.id}).eq('id',user.id); }catch(e){} }
    }catch(e){ console.warn('hitter',e); }
  }
  return {role:role,name:name,email:user.email};
}
async function cloudBoot(){
  if(!SBc){ DB.view='login'; render(); return; }
  try{ var s=await SBc.auth.getSession(); if(s.data&&s.data.session&&s.data.session.user){ await enterApp(s.data.session.user); return; } }
  catch(e){ console.warn(e); }
  DB.view='login'; render();
}
async function enterApp(user){
  var acc=await ensureAccount(user);
  var role=(acc&&acc.role)||'player';
  DB.user={ id:user.id, email:user.email, role:role, name:(acc&&acc.name)||user.email };
  await loadPlayers();
  if(role==='coach'){ DB.view='home'; DB.ctx={}; }
  else {
    var mine=DB.players.filter(function(p){return p.owner===user.id;})[0]||DB.players[0];
    if(mine){ DB.ctx={playerId:mine.id}; DB.view='profile'; }
    else { DB.view='login'; }
  }
  render();
  try{ history.replaceState({v:DB.view,c:DB.ctx},''); }catch(e){}
}
/* ---------- auth (Supabase) ---------- */
var authMode='login', loginRole='player', pendingEmail='', signupSport='baseball';
function fval(id){ var el=$('#'+id); return el?(el.value||'').trim():''; }
async function doAuth(){
  if(!SBc){ toast('Cloud not reachable'); return; }
  var email=fval('f_email').toLowerCase(), pass=fval('f_pass');
  if(!email||!pass){ toast('Enter email and password'); return; }
  if(authMode==='signup'){
    if(pass.length<6){ toast('Password must be at least 6 characters'); return; }
    var name=fval('f_name')||email;
    var opts={ data:{ role:loginRole, full_name:name, sport:(loginRole==='player'?signupSport:'baseball') } };
    if(loginRole==='coach'){ var code=fval('f_code'); if(!code){ toast('Enter the coach code'); return; } opts.data.coach_code=code; }
    if(typeof location!=='undefined' && String(location.protocol).indexOf('http')===0) opts.emailRedirectTo=location.origin;
    var su=await SBc.auth.signUp({ email:email, password:pass, options:opts });
    if(su.error){ toast(su.error.message); return; }
    if(su.data && su.data.session && su.data.session.user){ await enterApp(su.data.session.user); return; }
    /* no session returned: try an immediate sign-in (this project allows login before email confirm) */
    var si2=await SBc.auth.signInWithPassword({ email:email, password:pass });
    if(si2.data && si2.data.user){ await enterApp(si2.data.user); return; }
    /* only if the project truly requires confirmation do we show the check-email screen */
    pendingEmail=email; DB.view='confirm'; render(); return;
  }
  var si=await SBc.auth.signInWithPassword({ email:email, password:pass });
  if(si.error){ toast(si.error.message); return; }
  await enterApp(si.data.user);
}
async function logout(){ try{ if(SBc) await SBc.auth.signOut(); }catch(e){} DB.user=null; DB.players=[]; DB.ctx={}; DB.view='login'; render(); }

/* personal best across sessions (Avg LA just shows the latest number as-is) */
var TEST_METRICS={maxEV:1,avgEV:1,hardHitPct:1};
function bestMetric(p,key){
  var best=null,bestDate=null,latest=null,latestDate=null;
  var pmax=(key==='hardHitPct')?playerMaxEV(p):0;
  (p.blocks||[]).forEach(function(b){ (b.entries||[]).forEach(function(e){
    var val=null;
    if(e.type==='rapsodo'&&e.rap&&e.rap[key]>0){ val=e.rap[key]; }
    else if(e.type==='test'&&e.status!=='inprogress'&&TEST_METRICS[key]&&e.test){ try{ var ta=analyzeTest(e.test,pmax); if(ta&&ta[key]>0) val=ta[key]; }catch(_){} }
    if(val==null) return;
    if(latestDate===null||e.date>=latestDate){ latest=val; latestDate=e.date; }
    if(best===null||val>best){ best=val; bestDate=e.date; }
  });});
  if(key==='avgLA'){ if(latest!==null) return {value:latest,date:latestDate,latest:true}; }
  else if(best!==null){ return {value:best,date:bestDate}; }
  if(p.rap && p.rap[key]) return {value:p.rap[key],date:null,latest:(key==='avgLA')};
  return {value:null,date:null};
}
function rnBest(k,bm,u){ var show=(bm&&bm.value!=null&&bm.value!==0); var v=show?bm.value:'—'; var lab=(bm&&bm.latest)?'latest':'best'; var d=(show&&bm.date)?shortDate(bm.date):''; return '<div class="rn"><div class="k">'+k+'</div><div class="v">'+v+'<small> '+u+'</small></div>'+(d?'<div style="font-size:9px;color:var(--grey);letter-spacing:.3px;margin-top:3px">'+lab+' · '+d+'</div>':'')+'</div>'; }
/* aggregate stat cell: Max shows "best", others show "avg", all across every test */
function rnAgg(k,val,u,kind){ var show=(val>0); return '<div class="rn"><div class="k">'+k+'</div><div class="v">'+(show?val:'—')+'<small> '+u+'</small></div>'+(show&&kind?'<div style="font-size:9px;color:var(--grey);letter-spacing:.3px;margin-top:3px">'+kind+'</div>':'')+'</div>'; }
/* test-page Rapsodo input (bound to TEST.rap for this session) */
var RAP=null;
function rapField(lbl,key,u){ var v=(RAP&&RAP[key])?RAP[key]:''; return '<div class="field" style="flex:1"><label>'+lbl+' ('+u+')</label><input type="number" step="0.1" value="'+v+'" oninput="setRap(\''+key+'\',this.value)"></div>'; }
function setRap(key,v){ if(RAP) RAP[key]=(v===''?0:+v); }
function startRapsodo(pid,n){ DB.ctx.playerId=pid; DB.ctx.blockN=n; RAP=emptyRap(); RAP._fromTest=false;
  var p=curPlayer(); var b=p&&p.blocks&&p.blocks[n-1]; var t=b&&lastTest(b);
  if(t&&t.test){ try{ var a=analyzeTest(t.test, playerMaxEV(p)); if(a){ RAP.maxEV=a.maxEV||0; RAP.avgEV=a.avgEV||0; RAP.hardHitPct=a.hardHitPct||0; RAP._fromTest=(a.maxEV>0||a.avgEV>0); RAP._testDate=t.date; } }catch(_){} }
  go('rapsodo');
}
function viewRapsodo(){
  var p=curPlayer(); if(!p) return viewLogin(); var n=DB.ctx.blockN; var b=p.blocks[n-1];
  return '<div class="scroll">'
    +topbar('<button class="icon-btn" onclick="go(\'block\',{playerId:\''+p.id+'\',blockN:'+n+'})">'+IC.back+'</button>')

      +((RAP&&RAP._fromTest)?'<div style="background:rgba(131,245,44,.1);border:1px solid rgba(131,245,44,.35);border-radius:11px;padding:10px 12px;font-size:12px;line-height:1.5;color:#cdeeb0;margin-bottom:12px"><b style="color:#fff">Auto-filled from the hitting test</b>'+(RAP._testDate?' ('+shortDate(RAP._testDate)+')':'')+' — Max EV, Avg EV and Hard Hit% came from this block\'s test swings. Edit any of them if your Rapsodo unit shows different. Distance and Launch Angle aren\'t in the test, so enter those from Rapsodo.</div>':'')
      +'<div style="display:flex;gap:10px">'+rapField('Max EV','maxEV','mph')+rapField('Avg EV','avgEV','mph')+rapField('Hard Hit','hardHitPct','%')+'</div>'
      +'<div style="display:flex;gap:10px;margin-top:6px">'+rapField('Max Dist','maxDist','ft')+rapField('Avg Dist','avgDist','ft')+rapField('Avg LA','avgLA','°')+'</div>'
      +'<button class="btn" style="margin-top:14px" onclick="saveRapsodo()">Save Rapsodo Results</button>'
      +'<button class="btn ghost" style="margin-top:8px" onclick="go(\'block\',{playerId:\''+p.id+'\',blockN:'+n+'})">Cancel</button>'
    +'</div></div>';
}
async function saveRapsodo(){
  var p=curPlayer(); var n=DB.ctx.blockN; var b=p.blocks[n-1];
  var rap={maxEV:+RAP.maxEV||0,avgEV:+RAP.avgEV||0,maxDist:+RAP.maxDist||0,avgDist:+RAP.avgDist||0,avgLA:+RAP.avgLA||0,hardHitPct:+RAP.hardHitPct||0};
  var entry={ id:nid(), type:'rapsodo', date:new Date().toISOString().slice(0,10), rap:rap };
  if(!b.entries) b.entries=[]; b.entries.push(entry); b.date=entry.date;
  p.rap=Object.assign({}, rap);
  await savePlayer(p); toast('Rapsodo results saved'); go('results',{blockN:n, entryId:entry.id});
}

/* ================= COACH ROSTER ================= */
function setSport(s){ DB.sport=s; DB.search=''; render(); }
function rosterFiltered(){
  var sp=DB.sport||'baseball', fac=DB.facility||'';
  var base=DB.players.filter(function(p){ return (p.sport||'baseball')===sp && (p.facility||'')===fac; });
  base.sort(alphaCmp);
  var q=(DB.search||'').trim().toLowerCase();
  if(q.length===0) return base;
  if(q.length<3) return null;
  return base.filter(function(p){
    var f=String(p.first||'').toLowerCase(), l=String(p.last||'').toLowerCase();
    return f.indexOf(q)>=0 || l.indexOf(q)>=0 || (f+' '+l).indexOf(q)>=0;
  });
}
function rosterCountLabel(){ var list=rosterFiltered(); return list===null?'':(''+list.length); }
function rosterListHTML(){
  if(!DB.players.length) return '<div class="center-note">No players yet.</div>';
  var list=rosterFiltered();
  if(list===null) return '<div class="center-note">Type at least 3 letters of a first or last name.</div>';
  if(!list.length) return '<div class="center-note">No players match that name.</div>';
  return list.map(pCard).join('');
}

var WK_BATSPEED_ROT=[['Normal','Flamingos','Babe Ruth','Step Backs'],['Happy Gilmores','Step Backs','Rhythm','Wind-Up'],['2 Strike Stance','Rhythm','Normal','Flamingos'],['Babe Ruth','Wind-Up','Happy Gilmores','2 Strike Stance'],['Step Backs','Normal','Flamingos','Rhythm'],['Flamingos','2 Strike Stance','Wind-Up','Babe Ruth'],['Rhythm','Happy Gilmores','Step Backs','Normal'],['Wind-Up','Babe Ruth','2 Strike Stance','Happy Gilmores']];

/* ================= TEST LOGGER ================= */
var TEST=null;
var TEST_EID=null;
function secMeta(s){ return s==='frontToss'?{name:'Front Toss',nc:10,nn:5}:(s==='bp'?{name:'BP',nc:5,nn:10}:{name:'Machine',nc:5,nn:10}); }
function mkPitches(nc,nn){ var a=[],i; for(i=0;i<nc;i++)a.push({kind:'color',color:null,pick:null,ev:null,swing:null,na:false}); for(i=0;i<nn;i++)a.push({kind:'normal',color:null,pick:null,ev:null,swing:null,na:false}); return a; }
function initTest(p){ if(p&&!wkEquip(p).colorBalls){ return { section:'frontToss', noColor:true, frontToss:mkPitches(0,15), bp:mkPitches(0,15), machine:mkPitches(0,15) }; } return { section:'frontToss', frontToss:mkPitches(10,5), bp:mkPitches(5,10), machine:mkPitches(5,10) }; }
function startTest(pid){ go('block',{playerId:pid,blockN:1}); }
function startBlockTest(pid,n){ DB.ctx.playerId=pid; TEST=initTest(playerById(pid)); TEST_EID=null; DB.ctx.blockN=n; go('test'); }
function continueTest(pid,n,eid){ DB.ctx.playerId=pid; DB.ctx.blockN=n; var p=curPlayer(); var b=p&&p.blocks[n-1]; var e=b&&entryById(b,eid);
  if(!e||!e.test){ toast('Could not open test'); return; }
  TEST=e.test; if(!TEST.section) TEST.section='frontToss'; TEST_EID=eid; go('test');
}
function setSection(s){ TEST.section=s; render(); }
function setPitchColor(sec,i,field,c){ TEST[sec][i][field]=c; render(); }
function setSwing(sec,i,s){ TEST[sec][i].swing=s; render(); }
function setEV(sec,i,v){ var pt=TEST[sec][i]; pt.ev=(v===''?null:+v); if(v!=='') pt.na=false; }
function setNA(sec,i){ var pt=TEST[sec][i]; pt.na=!pt.na; if(pt.na) pt.ev=null; render(); }
function pitchDone(pt){
  if(pt.kind==='color'){ if(!(pt.color&&pt.pick&&pt.swing)) return false;
    if(pt.swing==='swing'&&pt.color!=='Red') return (pt.ev>0||pt.na); return true; }
  return (pt.ev>0||pt.na);
}
function testProgress(t){ var all=testPitches(t); var done=all.filter(pitchDone).length; return {done:done,total:all.length}; }

function testPitches(t){ return [].concat(t.frontToss,t.bp,t.machine); }
function avgOf(arr){ return arr.length?+(arr.reduce(function(a,b){return a+b;},0)/arr.length).toFixed(1):0; }
function swingRight(p){ return (p.color==='Red')? p.swing==='take' : p.swing==='swing'; }
function sectionStats(arr){
  var color=arr.filter(function(p){return p.kind==='color';});
  var picks=color.filter(function(p){return p.color&&p.pick;});
  var pickC=picks.filter(function(p){return p.pick===p.color;}).length;
  var dec=color.filter(function(p){return p.color&&p.swing;});
  var decC=dec.filter(swingRight).length;
  var evs=arr.filter(function(p){return p.ev>0&&p.color!=='Red';}).map(function(p){return p.ev;});
  return { colorN:picks.length, colorCorrect:pickC, colorAcc: picks.length?Math.round(pickC/picks.length*100):0,
    decN:dec.length, decCorrect:decC, decAcc: dec.length?Math.round(decC/dec.length*100):0,
    avgEV:avgOf(evs), evN:evs.length };
}
function analyzeTest(t,refMax){
  var all=testPitches(t);
  var sections={ frontToss:sectionStats(t.frontToss), bp:sectionStats(t.bp), machine:sectionStats(t.machine) };
  var color=all.filter(function(p){return p.kind==='color';});
  var picks=color.filter(function(p){return p.color&&p.pick;});
  var pickC=picks.filter(function(p){return p.pick===p.color;}).length;
  var dec=color.filter(function(p){return p.color&&p.swing;});
  var decC=dec.filter(swingRight).length;
  var reds=all.filter(function(p){return p.color==='Red';});
  var redTakes=reds.filter(function(p){return p.swing==='take';}).length;
  var nonRed=color.filter(function(p){return p.color&&p.color!=='Red';});
  var nonRedSwings=nonRed.filter(function(p){return p.swing==='swing';}).length;
  var colorHits=all.filter(function(p){return p.kind==='color'&&p.color&&p.color!=='Red'&&p.ev>0;});
  var normalHits=all.filter(function(p){return p.kind==='normal'&&p.ev>0;});
  var perColor={}; ['Green','Black','Blue'].forEach(function(c){ var evs=all.filter(function(p){return p.color===c&&p.ev>0;}).map(function(p){return p.ev;}); perColor[c]={n:evs.length,avg:avgOf(evs),max:evs.length?Math.max.apply(null,evs):0}; });
  var colorEVs=colorHits.map(function(p){return p.ev;}), normalEVs=normalHits.map(function(p){return p.ev;});
  var allEVs=colorEVs.concat(normalEVs);
  var swings=all.filter(function(p){ return (p.ev>0) || (p.color==='Red'&&p.swing==='swing'); }).length;
  var testMax=allEVs.length?Math.max.apply(null,allEVs):0;
  var hhBase=(refMax&&refMax>0)?refMax:testMax;       /* Hard Hit = swings at >=80% of the player's max EV */
  var hhThresh=0.8*hhBase;
  return {
    sections:sections,
    colorN:picks.length, colorCorrect:pickC, colorAcc: picks.length?Math.round(pickC/picks.length*100):0,
    decN:dec.length, decCorrect:decC, decAcc: dec.length?Math.round(decC/dec.length*100):0,
    reds:reds.length, redTakes:redTakes, redDiscipline: reds.length?Math.round(redTakes/reds.length*100):0,
    nonRed:nonRed.length, nonRedSwings:nonRedSwings, nonRedSwingPct: nonRed.length?Math.round(nonRedSwings/nonRed.length*100):0,
    swings:swings,
    avgColor:avgOf(colorEVs), avgNormal:avgOf(normalEVs), evDiff:+(avgOf(colorEVs)-avgOf(normalEVs)).toFixed(1),
    maxEV: testMax, avgEV:avgOf(allEVs),
    hardHitBase:+hhBase.toFixed(1), hardHitThresh:+hhThresh.toFixed(1),
    hardHitPct: (allEVs.length&&hhThresh>0)?Math.round(allEVs.filter(function(e){return e>=hhThresh;}).length/allEVs.length*100):0,
    perColor:perColor
  };
}
/* player's all-time max exit velo across completed tests + logged Rapsodo maxEV */
function playerMaxEV(p){ var m=0; ((p&&p.blocks)||[]).forEach(function(b){ blockEntries(b).forEach(function(e){
  if(e.type==='test'&&e.status!=='inprogress'&&e.test){ testPitches(e.test).forEach(function(pt){ if(pt.ev>0&&pt.ev>m)m=pt.ev; }); }
  else if(e.type==='rapsodo'&&e.rap&&e.rap.maxEV>m){ m=e.rap.maxEV; }
}); }); return m; }
/* aggregate exit velo across ALL completed tests, split by pitch recognition */
function evCategoryStats(p){
  function stat(a){ return {n:a.length, avg:a.length?+(a.reduce(function(x,y){return x+y;},0)/a.length).toFixed(1):0, max:a.length?Math.max.apply(null,a):0}; }
  var C=[],M=[],N=[]; var byBlock=[];
  ((p&&p.blocks)||[]).forEach(function(b){
    var c=[],m=[],n=[];
    blockEntries(b).forEach(function(e){ if(e.type==='test'&&e.status!=='inprogress'&&e.test){
      testPitches(e.test).forEach(function(pt){ if(!(pt.ev>0)) return;
        if(pt.kind==='normal'){ n.push(pt.ev); }
        else if(pt.color&&pt.color!=='Red'){ if(pt.pick===pt.color){ c.push(pt.ev); } else if(pt.pick){ m.push(pt.ev); } }
      });
    }});
    if(c.length||m.length||n.length){ byBlock.push({n:b.n,label:b.label,correct:stat(c),missed:stat(m),noncolor:stat(n)}); }
    C=C.concat(c); M=M.concat(m); N=N.concat(n);
  });
  return { correct:stat(C), missed:stat(M), noncolor:stat(N), byBlock:byBlock,
    hasData:(C.length||M.length||N.length)>0 };
}

function pitchCard(sec,i,pt){
  var isColor=pt.kind==='color'; var isRed=pt.color==='Red'; var num=i+1;
  var pickDone=pt.color&&pt.pick, pickOK=pickDone&&pt.pick===pt.color;

  var cls='empty';
  if(isColor){ if(pickDone||decDone){ cls=((pickDone&&!pickOK)||(decDone&&!decOK))?'wrong':'correct'; } }
  else { cls=(pt.ev>0||pt.na)?'correct':'empty'; }

  if(isColor){

    h+='<div class="lab">Exit Velo</div><div class="numrow" style="align-items:center">'
      +'<input type="number" inputmode="decimal" placeholder="'+(pt.na?'no read':'mph')+'" value="'+(pt.na?'':(pt.ev!=null?pt.ev:''))+'"'+(pt.na?' disabled style="opacity:.5"':'')+' oninput="setEV(\''+sec+'\','+i+',this.value)"><span class="u">mph</span>'
      +'<button class="seg '+(pt.na?'on':'')+'" style="margin-left:8px;flex:0 0 auto;padding:8px 12px" onclick="setNA(\''+sec+'\','+i+')" title="No read from Rapsodo — excluded from averages">NA</button>'
    +'</div>';

async function saveTest(finalize){
  var p=curPlayer(); var n=DB.ctx.blockN; var b=p.blocks[n-1]; var a=analyzeTest(TEST);
  var scores={ colorAcc:a.colorAcc, decAcc:a.decAcc, redDiscipline:a.redDiscipline, nonRedSwingPct:a.nonRedSwingPct, sections:a.sections };
  var status=finalize?'complete':'inprogress';
  if(!b.entries) b.entries=[];
  var existing=TEST_EID?entryById(b,TEST_EID):null;
  if(existing){ existing.test=TEST; existing.scores=scores; existing.status=status; b.date=existing.date; }
  else{
    var entry={ id:nid(), type:'test', date:new Date().toISOString().slice(0,10), test:TEST, scores:scores, status:status };
    b.entries.push(entry); b.date=entry.date; TEST_EID=entry.id;
  }
  await savePlayer(p);
  if(finalize){ var eid=TEST_EID; TEST_EID=null; toast('Test saved'); go('results',{blockN:n, entryId:eid}); }
  else{ go('block',{playerId:p.id, blockN:n}); toast('✓ Test saved — resume it anytime from this block'); }
}

/* ================= HPL REPORT ================= */
function delta(a,b){ return +((a||0)-(b||0)).toFixed(1); }
function dtxt(v,u){ if(v>0) return '+'+v+(u||'')+' since start'; if(v<0) return v+(u||'')+' since start'; return 'even since start'; }
/* ===== career aggregation across ALL completed tests + Rapsodo sessions =====
   Max EV / Max Dist = best of all; Avg EV / Avg Dist / Avg LA + Hard Hit% =
   aggregate across every swing/session. Section stats pooled over all tests. */
function careerStats(p){
  function mean(a){ return a.length? +(a.reduce(function(x,y){return x+y;},0)/a.length).toFixed(1):0; }
  function mx(a){ return a.length? Math.max.apply(null,a):0; }
  var evs=[]; var reds=0,redTakes=0,colorN=0,colorCorrect=0,decN=0,decCorrect=0;
  var sec={frontToss:{cN:0,cC:0,dN:0,dC:0,ev:[]},bp:{cN:0,cC:0,dN:0,dC:0,ev:[]},machine:{cN:0,cC:0,dN:0,dC:0,ev:[]}};
  var rMaxEV=[],rMaxDist=[],rAvgDist=[],rAvgLA=[],testCount=0,rapCount=0;
  (p.blocks||[]).forEach(function(b){ blockEntries(b).forEach(function(e){
    if(e.type==='test'&&e.status!=='inprogress'&&e.test){
      testCount++;
      ['frontToss','bp','machine'].forEach(function(k){ (e.test[k]||[]).forEach(function(pt){
        if(pt.kind==='color'){
          if(pt.color&&pt.pick){ sec[k].cN++; colorN++; if(pt.pick===pt.color){ sec[k].cC++; colorCorrect++; } }
          if(pt.color&&pt.swing){ sec[k].dN++; decN++; if(swingRight(pt)){ sec[k].dC++; decCorrect++; } }
          if(pt.color==='Red'){ reds++; if(pt.swing==='take') redTakes++; }
        }
        if(pt.ev>0&&pt.color!=='Red'){ evs.push(pt.ev); sec[k].ev.push(pt.ev); }
      }); });
    } else if(e.type==='rapsodo'&&e.rap){
      rapCount++;
      if(e.rap.maxEV>0) rMaxEV.push(e.rap.maxEV);
      if(e.rap.maxDist>0) rMaxDist.push(e.rap.maxDist);
      if(e.rap.avgDist>0) rAvgDist.push(e.rap.avgDist);
      if(e.rap.avgLA>0) rAvgLA.push(e.rap.avgLA);
    }
  }); });
  var maxEV=Math.max(mx(evs),mx(rMaxEV));
  var hardHitPct=(evs.length&&maxEV>0)?Math.round(evs.filter(function(v){return v>=0.8*maxEV;}).length/evs.length*100):0;
  function secOut(s){ return {colorN:s.cN,colorCorrect:s.cC,colorAcc:s.cN?Math.round(s.cC/s.cN*100):0,
    decN:s.dN,decCorrect:s.dC,decAcc:s.dN?Math.round(s.dC/s.dN*100):0,avgEV:mean(s.ev),evN:s.ev.length}; }
  return { maxEV:maxEV, avgEV:mean(evs), hardHitPct:hardHitPct, maxDist:mx(rMaxDist), avgDist:mean(rAvgDist), avgLA:mean(rAvgLA),
    colorN:colorN,colorCorrect:colorCorrect,colorAcc:colorN?Math.round(colorCorrect/colorN*100):0,
    decN:decN,decCorrect:decCorrect,decAcc:decN?Math.round(decCorrect/decN*100):0,
    reds:reds,redTakes:redTakes,redDiscipline:reds?Math.round(redTakes/reds*100):0,
    nonRedSwingPct:0, sections:{frontToss:secOut(sec.frontToss),bp:secOut(sec.bp),machine:secOut(sec.machine)},
    swingCount:evs.length, testCount:testCount, rapCount:rapCount, hasTests:testCount>0, hasAny:(testCount>0||rapCount>0) };
}
var LB_METRICS=[
  {k:'maxEV',     lbl:'Max EV',        unit:'mph', dec:1, desc:'Best single-swing exit velocity across all tests.'},
  {k:'avgEV',     lbl:'Avg EV',        unit:'mph', dec:1, desc:'Average exit velocity across every recorded swing.'},
  {k:'hardHitPct',lbl:'Hard Hit %',    unit:'%',   dec:0, desc:'Share of swings struck at 80%+ of the hitter max EV.'},
  {k:'maxDist',   lbl:'Max Distance',  unit:'ft',  dec:0, desc:'Longest batted-ball distance recorded.'},
  {k:'avgDist',   lbl:'Avg Distance',  unit:'ft',  dec:0, desc:'Average batted-ball distance across tests.'},
  {k:'colorAcc',  lbl:'Vision',        unit:'%',   dec:0, desc:'Pitch recognition — colored ball read correctly.'},
  {k:'decAcc',    lbl:'Swing Decision',unit:'%',   dec:0, desc:'Correct swing / take decisions on colored balls.'},
  {k:'workouts',  lbl:'Workouts',      unit:'',    dec:0, desc:'Total training days logged — the grind leaderboard. Show up, get counted.'}
];
function lbFmt(v,dec){ if(dec){ return (Math.round(v*10)/10).toFixed(1).replace(/\.0$/,''); } return Math.round(v); }
function devStats(p){
  var H=careerStats(p).maxEV||0;
  var METS=['maxEV','avgEV','hardHitPct','maxDist','avgDist','colorAcc','decAcc'];
  var series={}; METS.forEach(function(k){ series[k]=[]; });
  (p.blocks||[]).forEach(function(b){
    var evs=[], colorN=0,colorC=0, decN=0,decC=0, rMaxEV=0, rMaxDist=0, rAvgDist=0;
    blockEntries(b).forEach(function(e){
      if(e.type==='test'&&e.status!=='inprogress'&&e.test){
        ['frontToss','bp','machine'].forEach(function(kk){ (e.test[kk]||[]).forEach(function(pt){
          if(pt.kind==='color'){
            if(pt.color&&pt.pick){ colorN++; if(pt.pick===pt.color) colorC++; }
            if(pt.color&&pt.swing){ decN++; if(swingRight(pt)) decC++; }
          }
          if(pt.ev>0&&pt.color!=='Red'){ evs.push(pt.ev); }
        }); });
      } else if(e.type==='rapsodo'&&e.rap){
        if(e.rap.maxEV>rMaxEV) rMaxEV=e.rap.maxEV;
        if(e.rap.maxDist>rMaxDist) rMaxDist=e.rap.maxDist;
        if(e.rap.avgDist>0) rAvgDist=e.rap.avgDist;
      }
    });
    var n=b.n||0;
    var sMax=Math.max(evs.length?Math.max.apply(null,evs):0, rMaxEV);
    if(sMax>0) series.maxEV.push({n:n,v:sMax});
    if(evs.length) series.avgEV.push({n:n,v:+(evs.reduce(function(a,c){return a+c;},0)/evs.length).toFixed(1)});
    if(evs.length&&H>0) series.hardHitPct.push({n:n,v:Math.round(evs.filter(function(x){return x>=0.8*H;}).length/evs.length*100)});
    if(rMaxDist>0) series.maxDist.push({n:n,v:rMaxDist});
    if(rAvgDist>0) series.avgDist.push({n:n,v:rAvgDist});
    if(colorN>0) series.colorAcc.push({n:n,v:Math.round(colorC/colorN*100)});
    if(decN>0) series.decAcc.push({n:n,v:Math.round(decC/decN*100)});
  });
  var out={};
  METS.forEach(function(k){
    var s=series[k].sort(function(a,b){return a.n-b.n;});
    out[k]=(s.length>=2)?{ first:s[0].v, last:s[s.length-1].v, delta:+(s[s.length-1].v-s[0].v).toFixed(1), fromN:s[0].n, toN:s[s.length-1].n, count:s.length }:null;
  });
  return out;
}
/* Aggregate every test in a block: Max EV & Max Distance = the best across all tests that week; everything else = the average across all tests. */
function blockAgg(b,H){
  var maxEVs=[],avgEVs=[],hhs=[],maxDs=[],avgDs=[],las=[],dates=[],hCnt=0,rCnt=0;
  blockEntries(b).forEach(function(e){
    if(e.type==='test'&&e.status!=='inprogress'&&e.test){
      var evs=[]; ['frontToss','bp','machine'].forEach(function(k){ (e.test[k]||[]).forEach(function(pt){ if(pt.ev>0&&pt.color!=='Red') evs.push(pt.ev); }); });
      if(evs.length){ hCnt++; maxEVs.push(Math.max.apply(null,evs)); avgEVs.push(+(evs.reduce(function(a,c){return a+c;},0)/evs.length).toFixed(1)); if(H>0) hhs.push(Math.round(evs.filter(function(x){return x>=0.8*H;}).length/evs.length*100)); if(e.date)dates.push(e.date); }
    } else if(e.type==='rapsodo'&&e.rap){
      var R=e.rap,got=false;
      if(R.maxEV>0){maxEVs.push(R.maxEV);got=true;} if(R.avgEV>0)avgEVs.push(R.avgEV); if(R.hardHitPct>0)hhs.push(R.hardHitPct);
      if(R.maxDist>0){maxDs.push(R.maxDist);got=true;} if(R.avgDist>0)avgDs.push(R.avgDist); if(R.avgLA>0)las.push(R.avgLA);
      if(got){rCnt++; if(e.date)dates.push(e.date);}
    }
  });
  function mean(a){ return a.length?+(a.reduce(function(x,y){return x+y;},0)/a.length).toFixed(1):0; }
  function mx(a){ return a.length?Math.max.apply(null,a):0; }
  dates.sort();
  var cnt=Math.max(hCnt,rCnt);
  return { maxEV:mx(maxEVs), avgEV:mean(avgEVs), hardHitPct:Math.round(mean(hhs)), maxDist:mx(maxDs), avgDist:mean(avgDs), avgLA:mean(las), n:cnt, date:dates[dates.length-1]||'', has:cnt>0 };
}

function gradeLockedIn(P){

    if(pt.ev>0){ b.ev.push(pt.ev); pp.ev.push(pt.ev); any=true; }

    if(pt.la>0){ b.la.push(pt.la); pp.la.push(pt.la); any=true; }
