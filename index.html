<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HPL Youth — Player Development App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,600&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0a0b0a; --panel:#141614; --panel-2:#1b1e1b; --line:#2a2e2a;
    --green:#83f52c; --green-deep:#5bc70e; --white:#fff; --grey:#9aa39a; --grey-d:#5c615c;
    --red:#e23b3b; --blue:#3d7bff; --amber:#ffb020;
    --shadow:0 18px 40px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Barlow',system-ui,sans-serif;background:#050605;color:var(--white);
    min-height:100vh;display:flex;justify-content:center;padding:22px 12px 60px}
  .display{font-family:'Anton',sans-serif;font-style:italic;text-transform:uppercase;line-height:.95}
  .cond{font-family:'Barlow Semi Condensed',sans-serif}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit}

  /* device frame */
  .device{width:392px;max-width:100%;background:var(--black);border-radius:44px;padding:12px;
    box-shadow:var(--shadow),0 0 0 2px #1c1f1c,0 0 0 10px #0c0d0c;position:relative}
  .device::before{content:"";position:absolute;top:22px;left:50%;transform:translateX(-50%);
    width:120px;height:26px;background:#000;border-radius:16px;z-index:30}
  .viewport{background:
      radial-gradient(900px 380px at 50% -12%, rgba(131,245,44,.08), transparent 60%),#080908;
    border-radius:34px;overflow:hidden;height:812px;position:relative;border:1px solid var(--line);
    display:flex;flex-direction:column}
  .scroll{flex:1;overflow-y:auto;overflow-x:hidden}
  .scroll::-webkit-scrollbar{width:0}

  /* shared header */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:40px 18px 12px;position:relative;z-index:5}
  .brand{display:flex;align-items:center;gap:9px}
  .badge{width:34px;height:34px;border-radius:50%;flex:0 0 auto;
    background:radial-gradient(circle at 50% 40%,#fff 0 42%,#0a0b0a 43% 100%);
    border:2px solid var(--green);display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px rgba(131,245,44,.4)}
  .badge span{font-family:'Anton';font-style:italic;color:var(--green-deep);font-size:15px}
  .brand h1{font-family:'Anton';font-style:italic;font-size:18px;letter-spacing:.4px}
  .brand h1 em{color:var(--green);font-style:normal}
  .hpl-logo{flex:0 0 auto;filter:drop-shadow(0 0 5px rgba(131,245,44,.45))}
  .logo-wrap{display:flex;justify-content:center;margin:0 auto 18px;filter:drop-shadow(0 0 18px rgba(131,245,44,.4))}
  .icon-btn{width:38px;height:38px;border-radius:11px;background:var(--panel);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:#fff}
  .icon-btn svg{width:18px;height:18px}
  .back{display:flex;align-items:center;gap:7px;color:#fff;font-family:'Barlow Semi Condensed';font-weight:700;
    text-transform:uppercase;letter-spacing:1px;font-size:13px}
  .back svg{width:18px;height:18px;color:var(--green)}
  .pad{padding:4px 16px 40px}

  /* login */
  .login{height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 30px;text-align:center}
  .login .logo{width:96px;height:96px;border-radius:50%;margin:0 auto 20px;
    background:radial-gradient(circle at 50% 40%,#fff 0 44%,#0a0b0a 45% 100%);border:3px solid var(--green);
    display:flex;align-items:center;justify-content:center;box-shadow:0 0 26px rgba(131,245,44,.4)}
  .login .logo span{font-family:'Anton';font-style:italic;font-size:40px;color:var(--green-deep)}
  .login h2{font-family:'Anton';font-style:italic;font-size:30px;line-height:.95}
  .login h2 em{color:var(--green);font-style:normal}
  .login p.sub{color:var(--grey);font-size:13px;margin:8px 0 26px;letter-spacing:.3px}
  .field{text-align:left;margin-bottom:14px}
  .field label{display:block;font-family:'Barlow Semi Condensed';font-weight:700;text-transform:uppercase;
    letter-spacing:1px;font-size:11px;color:var(--grey);margin-bottom:6px}
  .field input,.field select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:13px 14px;font-size:15px;color:#eef;font-weight:500}
  .field input:focus,.field select:focus{outline:none;border-color:var(--green)}
  .btn{background:linear-gradient(180deg,var(--green),var(--green-deep));color:#0a0b0a;border-radius:13px;
    padding:15px;width:100%;font-family:'Anton';font-style:italic;font-size:17px;letter-spacing:.5px;
    text-transform:uppercase;box-shadow:0 10px 22px rgba(131,245,44,.3);margin-top:6px}
  .btn.ghost{background:var(--panel);color:#fff;border:1px solid var(--line);box-shadow:none}
  .btn.sm{padding:11px;font-size:14px}
  .role-switch{display:flex;gap:8px;margin-bottom:22px;background:var(--panel);border:1px solid var(--line);
    border-radius:13px;padding:5px}
  .role-switch button{flex:1;padding:10px;border-radius:9px;font-family:'Barlow Semi Condensed';font-weight:700;
    text-transform:uppercase;letter-spacing:.5px;font-size:12px;color:var(--grey)}
  .role-switch button.on{background:var(--green);color:#0a0b0a}
  .hint{font-size:11px;color:var(--grey-d);margin-top:16px;line-height:1.5}
  .hint code{color:var(--green);background:rgba(131,245,44,.08);padding:1px 5px;border-radius:5px}

  /* sport toggle */
  .sport-toggle{display:flex;gap:8px;margin:2px 16px 4px;background:var(--panel);border:1px solid var(--line);
    border-radius:13px;padding:5px}
  .sport-toggle button{flex:1;padding:11px;border-radius:9px;font-family:'Barlow Semi Condensed';font-weight:700;
    text-transform:uppercase;letter-spacing:.6px;font-size:13px;color:var(--grey);display:flex;align-items:center;
    justify-content:center;gap:7px}
  .sport-toggle button.on{background:var(--green);color:#0a0b0a}
  .sport-toggle button svg{width:16px;height:16px}

  .hello{padding:8px 2px 6px}
  .hello p{color:var(--grey);font-size:13px;font-weight:500}
  .hello h2{font-family:'Anton';font-style:italic;font-size:25px;margin-top:2px}
  .hello h2 em{color:var(--green);font-style:normal}

  .searchbar{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);
    border-radius:13px;padding:12px 13px;margin:10px 0 6px;color:var(--grey)}
  .searchbar svg{width:16px;height:16px;flex:0 0 auto}
  .searchbar input{flex:1;background:none;border:none;color:#fff;font-size:14px}
  .searchbar input:focus{outline:none}
  .searchbar input::placeholder{color:var(--grey-d)}

  .list-head{display:flex;justify-content:space-between;align-items:baseline;margin:16px 2px 10px}
  .list-head .lbl{font-family:'Barlow Semi Condensed';font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
    font-size:12px;color:var(--grey)}
  .list-head .cnt{color:var(--green);font-weight:700;font-size:12px}

  .p-card{display:flex;align-items:center;gap:13px;background:var(--panel);border:1px solid var(--line);
    border-left:3px solid var(--green);border-radius:16px;padding:12px;margin-bottom:10px;width:100%;text-align:left}
  .p-photo{width:54px;height:54px;border-radius:13px;flex:0 0 auto;object-fit:cover;border:2px solid #303430;background:#222}
  .p-info{flex:1;min-width:0}
  .p-info h3{font-family:'Barlow Semi Condensed';font-weight:700;font-size:17px;line-height:1.1}
  .p-info .meta{color:var(--grey);font-size:12px;font-weight:500;margin-top:2px}
  .hand{width:29px;height:29px;border-radius:9px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    font-family:'Anton';font-style:italic;font-size:13px;background:rgba(131,245,44,.12);color:var(--green);
    border:1px solid rgba(131,245,44,.4)}
  .hand.sw{background:rgba(226,59,59,.12);color:#ff7b6b;border-color:rgba(226,59,59,.4)}
  .chev{color:#4a4f4a;flex:0 0 auto}

  .fab{position:absolute;bottom:80px;right:18px;width:56px;height:56px;border-radius:18px;z-index:20;
    background:linear-gradient(180deg,var(--green),var(--green-deep));color:#0a0b0a;display:flex;align-items:center;
    justify-content:center;font-family:'Anton';font-size:30px;box-shadow:0 10px 24px rgba(131,245,44,.4)}

  .tabbar{height:66px;background:#0c0e0c;border-top:1px solid var(--line);display:flex;justify-content:space-around;
    align-items:center;padding:0 6px 8px}
  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:#5a5f5a;font-size:10px;font-weight:600;
    text-transform:uppercase;letter-spacing:.5px;background:none}
  .tab svg{width:21px;height:21px}
  .tab.on{color:var(--green)}

  /* profile */
  .prof-hero{text-align:center;padding:6px 16px 0}
  .prof-photo-wrap{position:relative;width:132px;height:132px;margin:2px auto 0}
  .prof-photo{width:132px;height:132px;border-radius:24px;object-fit:cover;border:3px solid var(--green);
    box-shadow:0 0 0 5px #0a0b0a,0 0 24px rgba(131,245,44,.3)}
  .prof-hand{position:absolute;bottom:-8px;right:6px;width:38px;height:38px;border-radius:12px;display:flex;
    align-items:center;justify-content:center;font-family:'Anton';font-style:italic;font-size:17px;
    background:linear-gradient(180deg,var(--green),var(--green-deep));color:#0a0b0a;border:3px solid #0a0b0a}
  .prof-name{font-family:'Anton';font-style:italic;font-size:27px;margin-top:14px;line-height:1}
  .prof-name em{color:var(--green);font-style:normal}
  .prof-sub{color:var(--grey);font-family:'Barlow Semi Condensed';font-weight:600;letter-spacing:.8px;
    text-transform:uppercase;font-size:12px;margin-top:6px}
  .prof-sub .dot{color:var(--green);margin:0 5px}
  .stat-row{display:flex;gap:9px;padding:16px 16px 2px}
  .stat{flex:1;background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--green);border-radius:13px;
    padding:11px 6px;text-align:center}
  .stat .k{font-family:'Barlow Semi Condensed';font-weight:600;color:var(--grey);text-transform:uppercase;
    letter-spacing:.6px;font-size:9.5px}
  .stat .v{font-family:'Anton';font-style:italic;font-size:19px;margin-top:4px}
  .stat .v small{font-size:10px;color:var(--grey);font-family:'Barlow';font-style:normal;font-weight:600}

  .detail-card{margin:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden}
  .detail-card .row{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;border-bottom:1px solid var(--line)}
  .detail-card .row:last-child{border-bottom:none}
  .detail-card .row .k{color:var(--grey);font-size:13px;font-weight:500;display:flex;align-items:center;gap:9px}
  .detail-card .row .k svg{width:16px;height:16px;color:var(--green)}
  .detail-card .row .v{font-family:'Barlow Semi Condensed';font-weight:700;font-size:15px}
  .join{text-align:center;font-style:italic;color:var(--grey);font-size:12.5px;margin:2px 16px 0}
  .join b{color:#c8ccc8;font-weight:600}

  .section-lbl{font-family:'Barlow Semi Condensed';font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
    font-size:12px;color:var(--grey);margin:22px 18px 10px;display:flex;justify-content:space-between;align-items:center}
  .section-lbl .link{color:var(--green);font-size:11px}

  /* assessment timeline */
  .assess{display:flex;gap:9px;overflow-x:auto;padding:0 16px 4px}
  .assess::-webkit-scrollbar{height:0}
  .assess .a{flex:0 0 auto;width:96px;background:var(--panel);border:1px solid var(--line);border-radius:13px;
    padding:11px 10px;text-align:center}
  .assess .a.cur{border-color:var(--green);box-shadow:0 0 14px rgba(131,245,44,.2)}
  .assess .a .wk{font-family:'Anton';font-style:italic;font-size:15px}
  .assess .a .dt{color:var(--grey);font-size:10px;margin-top:2px}
  .assess .a .ev{color:var(--green);font-weight:700;font-size:12px;margin-top:6px}
  /* 4-week block carousel */
  .block-carousel{display:flex;align-items:stretch;gap:6px;padding:0 12px}
  .bc-nav{flex:0 0 auto;width:34px;background:var(--panel);border:1px solid var(--line);border-radius:11px;
    color:var(--green);display:flex;align-items:center;justify-content:center}
  .bc-nav:disabled{opacity:.3;color:var(--grey-d)}
  .bc-nav svg{width:16px;height:16px}
  .assess.blk-strip{flex:1;padding:0;overflow:visible}
  .assess .a.blk{width:auto;flex:1 1 0;min-width:0;padding:13px 4px}
  .assess .a.blk .wk{font-family:'Barlow Semi Condensed';font-weight:700;font-size:12px;letter-spacing:.5px;color:var(--grey)}
  .assess .a.blk .blk-lbl{font-family:'Anton';font-style:italic;font-size:22px;color:#fff;margin-top:2px;white-space:nowrap}
  .assess .a.blk.empty{opacity:.5}
  .assess .a.blk.empty .ev{color:var(--grey-d)}

  /* drill list on profile */
  .drill-card{margin:0 16px 11px;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px;width:calc(100% - 32px);text-align:left;display:block}
  .drill-card .dc-top{display:flex;align-items:center;gap:11px}
  .dc-ic{width:40px;height:40px;border-radius:11px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    background:rgba(131,245,44,.1);border:1px solid rgba(131,245,44,.3);color:var(--green);font-family:'Anton';font-style:italic;font-size:16px}
  .dc-name{flex:1}
  .dc-name h4{font-family:'Barlow Semi Condensed';font-weight:700;font-size:16px}
  .dc-name .st{font-size:11.5px;color:var(--grey);margin-top:1px}
  .lvl-badge{font-family:'Barlow Semi Condensed';font-weight:700;font-size:11px;text-transform:uppercase;
    letter-spacing:.5px;padding:4px 9px;border-radius:8px;background:var(--panel-2);color:var(--grey);border:1px solid var(--line)}
  .lvl-badge.l1{background:rgba(61,123,255,.14);color:#7ea8ff;border-color:rgba(61,123,255,.4)}
  .lvl-badge.l2{background:rgba(131,245,44,.14);color:var(--green);border-color:rgba(131,245,44,.4)}
  .lvl-badge.done{background:rgba(255,176,32,.14);color:var(--amber);border-color:rgba(255,176,32,.4)}
  .lvl-badge.locked{background:#191b19;color:#5c615c;border-color:var(--line);display:inline-flex;align-items:center;gap:3px}
  .lvl-badge.locked svg{width:11px;height:11px}
  .lv-tags{display:flex;flex-direction:column;gap:4px;align-items:flex-end;flex:0 0 auto}
  .wk-note{margin:2px 16px 4px;font-size:11.5px;color:var(--grey);font-style:italic}
  .wk-note b{color:var(--green);font-style:normal}
  .assess .a{cursor:pointer;background:var(--panel);border:1px solid var(--line)}
  .prog{height:6px;border-radius:4px;background:#22261f;margin-top:11px;overflow:hidden}
  .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--green-deep),var(--green));border-radius:4px}
  .prog-txt{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--grey)}
  .prog-txt b{color:#fff}

  /* drill logger */
  .logger-head{padding:2px 16px 6px}
  .logger-head h2{font-family:'Anton';font-style:italic;font-size:23px;line-height:1}
  .logger-head h2 em{color:var(--green);font-style:normal}
  .logger-head .desc{color:var(--grey);font-size:12.5px;margin-top:6px;line-height:1.45}
  .subtabs{display:flex;gap:7px;margin:12px 16px 6px}
  .subtabs button{flex:1;padding:9px;border-radius:10px;font-family:'Barlow Semi Condensed';font-weight:700;
    text-transform:uppercase;letter-spacing:.5px;font-size:11.5px;color:var(--grey);background:var(--panel);border:1px solid var(--line)}
  .subtabs button.on{background:var(--green);color:#0a0b0a;border-color:var(--green)}

  .score-strip{display:flex;gap:8px;padding:8px 16px 4px}
  .score-strip .sc{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 6px;text-align:center}
  .score-strip .sc.pass{border-color:var(--green);box-shadow:0 0 12px rgba(131,245,44,.18)}
  .score-strip .sc.fail{border-color:rgba(226,59,59,.5)}
  .score-strip .sc .k{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--grey);font-weight:600}
  .score-strip .sc .v{font-family:'Anton';font-style:italic;font-size:20px;margin-top:2px}
  .score-strip .sc.pass .v{color:var(--green)}
  .score-strip .sc.fail .v{color:#ff7b6b}

  .swing-list{padding:8px 16px 20px}
  .swing{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:11px 12px;margin-bottom:9px}
  .swing.correct{border-left:3px solid var(--green)}
  .swing.wrong{border-left:3px solid var(--red)}
  .swing.empty{border-left:3px solid var(--line)}
  .swing .sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
  .swing .sh .n{font-family:'Barlow Semi Condensed';font-weight:700;font-size:13px;color:var(--grey);text-transform:uppercase;letter-spacing:.5px}
  .swing .sh .tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:3px 8px;border-radius:7px}
  .swing .sh .tag.ok{background:rgba(131,245,44,.16);color:var(--green)}
  .swing .sh .tag.no{background:rgba(226,59,59,.16);color:#ff7b6b}
  .swing .sh .tag.round{background:var(--panel-2);color:var(--grey);border:1px solid var(--line)}
  .swing .lab{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--grey-d);font-weight:700;margin:6px 0 5px}
  .segrow{display:flex;flex-wrap:wrap;gap:6px}
  .seg{padding:8px 0;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);color:var(--grey);
    font-family:'Barlow Semi Condensed';font-weight:700;font-size:13px;text-align:center;flex:1;min-width:38px}
  .seg.on{background:var(--green);color:#0a0b0a;border-color:var(--green)}
  .seg.big{font-family:'Anton';font-style:italic;font-size:15px;padding:10px 0}
  /* color chips */
  .seg.c-red.on{background:var(--red);border-color:var(--red);color:#fff}
  .seg.c-green.on{background:#37c837;border-color:#37c837;color:#062}
  .seg.c-black.on{background:#000;border-color:#666;color:#fff}
  .seg.c-blue.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .seg.swing-y.on{background:var(--green);border-color:var(--green);color:#0a0b0a}
  .seg.take-n.on{background:var(--amber);border-color:var(--amber);color:#0a0b0a}
  .numrow{display:flex;gap:8px;align-items:center;margin-top:4px}
  .numrow input{flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;
    color:#fff;font-size:15px;font-weight:600;width:100%}
  .numrow input:focus{outline:none;border-color:var(--green)}
  .numrow .u{font-size:11px;color:var(--grey);font-weight:600}

  /* analysis */
  .analysis{margin:6px 16px 16px;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px}
  .analysis h4{font-family:'Barlow Semi Condensed';font-weight:700;text-transform:uppercase;letter-spacing:1px;
    font-size:12px;color:var(--grey);margin-bottom:12px}
  .amx{display:flex;flex-direction:column;gap:9px}
  .amx .arow{display:flex;align-items:center;gap:10px}
  .amx .arow .cl{width:66px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:7px}
  .amx .arow .dot{width:13px;height:13px;border-radius:4px;flex:0 0 auto;border:1px solid #0004}
  .amx .arow .bar{flex:1;height:9px;background:#22261f;border-radius:5px;overflow:hidden}
  .amx .arow .bar i{display:block;height:100%;border-radius:5px}
  .amx .arow .pc{width:56px;text-align:right;font-size:11px;color:var(--grey);font-weight:600}
  .amx .arow .pc b{color:#fff}
  .insight{margin:0 16px 16px;border-radius:13px;padding:12px 14px;font-size:12.5px;line-height:1.5;
    background:rgba(255,176,32,.08);border:1px solid rgba(255,176,32,.3);color:#f0d9a8}
  .insight.good{background:rgba(131,245,44,.08);border-color:rgba(131,245,44,.3);color:#cdeeb0}
  .insight b{color:#fff}

  /* objective banner */
  .objective{margin:8px 16px 4px;background:rgba(131,245,44,.07);border:1px solid rgba(131,245,44,.28);
    border-radius:13px;padding:11px 13px;display:flex;gap:11px;align-items:flex-start}
  .objective .badge-n{flex:0 0 auto;min-width:44px;text-align:center;background:var(--green);color:#0a0b0a;
    border-radius:9px;padding:6px 4px}

function isHardHit(ev, maxEV){ return maxEV>0 && ev >= 0.8*maxEV; }
function rapsodoStats(swings){ // swings: [{ev,dist}]
  const evs=swings.filter(s=>s.ev>0).map(s=>s.ev);
  const ds=swings.filter(s=>s.dist>0).map(s=>s.dist);
  if(!evs.length) return {n:0,avgEV:0,maxEV:0,avgDist:0,maxDist:0,hardHitPct:0};
  const maxEV=Math.max(...evs);
  const hh=evs.filter(e=>e>=0.8*maxEV).length;
  return {
    n:evs.length,
    avgEV:+(evs.reduce((a,b)=>a+b,0)/evs.length).toFixed(1),
    maxEV:maxEV,
    avgDist: ds.length? Math.round(ds.reduce((a,b)=>a+b,0)/ds.length):0,
    maxDist: ds.length? Math.max(...ds):0,
    hardHitPct: pct(hh,evs.length)
  };
}
/* accuracy over swings where a correctness flag is set */
function accuracy(swings, isCorrect){
  const done=swings.filter(s=>s._done);
  const c=done.filter(isCorrect).length;
  return {done:done.length, correct:c, pct:pct(c,done.length)};
}

/* ================= VIEWS ================= */
function render(){
  const vp=$('#vp');
  const v=DB.view;
  if(v==='login') vp.innerHTML=viewLogin();
  else if(v==='roster') vp.innerHTML=viewRoster();
  else if(v==='profile') vp.innerHTML=viewProfile();
  else if(v==='drill') vp.innerHTML=viewDrill();
  else if(v==='addPlayer') vp.innerHTML=viewAddPlayer();
  else if(v==='reward') vp.innerHTML=viewReward();
  else if(v==='parentHome') vp.innerHTML=viewParentHome();
  else if(v==='coaches') vp.innerHTML=viewCoaches();
  else if(v==='results') vp.innerHTML=viewResults();
  else if(v==='block') vp.innerHTML=viewBlock();
  bindDynamic();
  if(DB.view==='reward') startConfetti();
}

/* ---------- LOGIN ---------- */
var loginRole='coach';
function viewLogin(){
  const su=authMode==='signup', coach=signupRole==='coach';
  const action = !su ? 'doLogin()' : (coach ? "doSignup('coach')" : "doSignup('parent')");
  const btn = !su ? 'Log In' : (coach ? 'Create Coach Account' : 'Create Parent Account');
  return `<div class="login">
    <div class="logo-wrap">${logoSVG(112,true)}</div>
    <h2>HPL <em>YOUTH</em></h2>
    <p class="sub">Hitting Performance Lab · Player Development</p>
    <div class="role-switch">
      <button class="${authMode==='login'?'on':''}" onclick="authMode='login';render()">Log In</button>
      <button class="${authMode==='signup'?'on':''}" onclick="authMode='signup';render()">Sign Up</button>
    </div>
    ${su?`<div class="role-switch" style="margin-top:8px">
      <button class="${signupRole==='parent'?'on':''}" onclick="signupRole='parent';render()">I'm a Parent</button>
      <button class="${signupRole==='coach'?'on':''}" onclick="signupRole='coach';render()">I'm a Coach</button>
    </div>`:''}
    ${su?`<div class="field"><label>Your Name</label><input id="nm" type="text" placeholder="First Last"></div>`:''}
    <div class="field"><label>Email</label><input id="email" type="email" placeholder="you@email.com"></div>
    <div class="field"><label>Password</label><input id="pw" type="password" placeholder="${su?'Create a password (6+ characters)':'Your password'}"></div>
    ${su&&coach?`<div class="field"><label>Coach Access Code</label><input id="code" type="text" placeholder="Code from HPL"></div>`:''}
    ${su&&!coach?`<div class="consent-box">
      <input type="checkbox" id="consent" ${consentAgreed?'checked':''} onchange="consentAgreed=this.checked">
      <label>I am my child's parent or legal guardian and I have read and agree to the <a onclick="openWaiver()">Parental Consent &amp; Liability Waiver</a>, including consent for HPL Youth to collect and use my child's performance data (COPPA).</label>
    </div>`:''}
    <button class="btn" onclick="${action}">${btn}</button>
    <div class="hint">${su?(coach?'Coaches: enter the access code HPL gave you.':'Parents: create your account, then add your player.'):'Log in to your HPL Youth account.'}</div>
  </div>`;
}
async function doLogin(){
  const email=(($('#email')&&$('#email').value)||'').trim().toLowerCase();
  const pw=(($('#pw')&&$('#pw').value)||'');
  if(!SBc){ toast('Cloud not reachable'); return; }
  if(!email||!pw){ toast('Enter your email and password'); return; }
  toast('Logging in…');
  const {data,error}=await SBc.auth.signInWithPassword({email,password:pw});
  if(error){ toast(error.message||'Login failed'); return; }
  await enterApp(data.user);
}
async function doSignup(role){
  const name=(($('#nm')&&$('#nm').value)||'').trim();
  const email=(($('#email')&&$('#email').value)||'').trim().toLowerCase();
  const pw=(($('#pw')&&$('#pw').value)||'');
  const code=(($('#code')&&$('#code').value)||'').trim();
  if(!SBc){ toast('Cloud not reachable'); return; }
  if(!email||pw.length<6){ toast('Enter email and a 6+ character password'); return; }
  if(role==='parent' && !consentAgreed){ toast('Please read and agree to the Parental Consent & Waiver'); return; }
  toast('Creating account…');
  const consent_at=new Date().toISOString();
  const {data,error}=await SBc.auth.signUp({email,password:pw,options:{data:{full_name:name,role:role,code:code,
    consent_agreed:(role==='parent'), consent_version:CONSENT_VERSION, consent_at:consent_at}}});
  if(error){ toast(error.message||'Sign-up failed'); return; }
  if(data.session&&data.user){ await enterApp(data.user); }
  else{ toast('Account created. Confirm via email if asked, then log in.'); authMode='login'; render(); }
}
async function logout(){ try{ if(SBc) await SBc.auth.signOut(); }catch(e){} AUTH=null; DB.user=null; DB.players=[]; DB.view='login'; render(); }

/* ---------- shared header ---------- */
function topbar(right){ return `<div class="topbar">
  <div class="brand">${logoSVG(36,false)}<h1>HPL <em>YOUTH</em></h1></div>
  ${right||''}</div>`; }

/* ---------- ROSTER (coach) ---------- */
function viewRoster(){
  const sp=DB.sport;
  const term=DB.search.toLowerCase();
  const list=DB.players.filter(p=>p.sport===sp &&
     (`${p.first} ${p.last}`.toLowerCase().includes(term)));
  const cards=list.map(p=>`
    <button class="p-card" onclick="go('profile',{playerId:'${p.id}',week:0})">
      <img class="p-photo" src="${p.photo}" alt="">
      <div class="p-info"><h3>${esc(p.first)} ${esc(p.last)}</h3>
        <div class="meta">${p.age} yrs · ${esc(p.height)} · ${p.weight} lbs</div></div>
      <div class="hand ${p.hand==='S'?'sw':''}">${p.hand}</div>${IC.chev}
    </button>`).join('') || `<div class="center-note">No ${sp} players match "${esc(DB.search)}".</div>`;

  return `<div class="scroll">
    ${topbar(`<button class="icon-btn" onclick="logout()" title="Log out">${IC.user}</button>`)}
    <div class="sport-toggle">
      <button class="${sp==='baseball'?'on':''}" onclick="DB.sport='baseball';render()">${IC.ball} Baseball</button>
      <button class="${sp==='softball'?'on':''}" onclick="DB.sport='softball';render()">${IC.ball} Softball</button>
    </div>
    <div class="pad">
      <div class="hello"><p>${esc(DB.user.name)} · Coach view</p><h2>MY <em>PLAYERS</em></h2></div>
      <div class="searchbar">${IC.search}
        <input id="search" placeholder="Search players by name…" value="${esc(DB.search)}" oninput="DB.search=this.value;liveRoster()">
      </div>
      <div class="list-head"><span class="lbl">${sp} Roster</span><span class="cnt">${list.length} PLAYER${list.length!==1?'S':''}</span></div>
      <div id="rosterList">${cards}</div>
    </div>
  </div>
  ${tabbar('roster')}`;
}
function liveRoster(){ // re-render only list to keep focus
  const sp=DB.sport, term=DB.search.toLowerCase();
  const list=DB.players.filter(p=>p.sport===sp && (`${p.first} ${p.last}`.toLowerCase().includes(term)));
  const el=$('#rosterList'); if(!el) return;

function levelBadge(lv){ return `<span class="lvl-badge l2">Level ${lv}</span>`; }
/* 13 four-week blocks tied to each player's real start date */
var NUM_BLOCKS=13;
function blockLabel(i){ return (i*4+1)+'-'+(i*4+4); }
function daysSince(iso){ if(!iso) return 0; const d=new Date(iso); if(isNaN(d.getTime())) return 0; return Math.max(0, Math.floor((Date.now()-d.getTime())/86400000)); }
function playerWeek(p){ return Math.max(1, Math.min(52, Math.floor(daysSince(p&&p.join)/7)+1)); }
function currentBlockIdx(p){ return Math.max(0, Math.min(NUM_BLOCKS-1, Math.floor((playerWeek(p)-1)/4))); }
function assBlock(a,j){ return a && a.block!=null ? a.block : j; }
function blockAssessment(p,i){ const arr=(p&&p.assessments)||[]; for(let j=0;j<arr.length;j++){ if(assBlock(arr[j],j)===i) return arr[j]; } return null; }
function blockTested(a){ return !!(a && a.drills && Object.keys(a.drills).some(k=>a.drills[k]&&a.drills[k].pct!=null)); }
function ensureCurrentAssessment(p){
  const i=currentBlockIdx(p); let a=blockAssessment(p,i);
  if(!a){ a={block:i, week:i*4+1, date:new Date().toISOString().slice(0,10), maxEV:p.maxEV||0, drills:{}}; p.assessments.push(a); }
  else if(a.block==null){ a.block=i; }
  return a;
}
function weekIdx(){ return currentBlockIdx(curPlayer()); }
function curAssess(){ const p=curPlayer(); return blockAssessment(p,currentBlockIdx(p)) || {block:currentBlockIdx(p), week:currentBlockIdx(p)*4+1, date:'', maxEV:0, drills:{}}; }
function slideBlocks(newStart){ const vp=$('#vp'); const y=vp?vp.scrollTop:0; DB.ctx.bstart=newStart; render(); const v=$('#vp'); if(v) v.scrollTop=y; }
function blockCarousel(p){
  const win=4, maxStart=NUM_BLOCKS-win;
  const cur=currentBlockIdx(p);
  let start=DB.ctx.bstart; if(start==null) start=Math.max(0,Math.min(cur-1,maxStart));
  start=Math.max(0,Math.min(start,maxStart));
  let cells='';
  for(let i=start;i<start+win;i++){
    const a=blockAssessment(p,i); const tested=blockTested(a);
    cells+=`<button class="a blk ${tested?'':'empty'} ${i===cur?'cur':''}" onclick="go('block',{block:${i}})">
      <div class="wk">WEEKS</div><div class="blk-lbl">${blockLabel(i)}</div>
      <div class="ev">${tested?(a.maxEV?a.maxEV+' mph':'✓ done'):(i===cur?'current':'—')}</div></button>`;
  }
  const prev=`<button class="bc-nav" ${start<=0?'disabled':''} onclick="slideBlocks(${start-1})">${IC.back}</button>`;
  const next=`<button class="bc-nav" ${start>=maxStart?'disabled':''} onclick="slideBlocks(${start+1})">${IC.chev}</button>`;
  return `<div class="block-carousel">${prev}<div class="assess blk-strip">${cells}</div>${next}</div>
    <div class="wk-note" style="text-align:center">Player is in Week ${playerWeek(p)} · tap a block for results</div>`;
}

/* ================= DRILL ENGINE ================= */
var SESSION=null;
function startSession(key,level){
  const p=curPlayer();
  SESSION={ key, level, sub:0, maxEV:p.maxEV, swings:buildSwings(key,level,p), rapsodo:key==='rapsodo'?buildRapsodo(p):null };
}
function buildSwings(key,level,p){
  // returns array of swing slots depending on drill+level+subdrill
  return null; // built per-subtab lazily in viewDrill via drillModel
}

/* Each drill defines subtabs -> panels. Panel types:
   call  = coach enters thrown value + what the kid CALLED (color/number). correct = match.
   decide= coach enters ball (color/number) + kid SWING/TAKE. correct = matches rule.
   spray = target is preset (goal); coach enters where it ACTUALLY went. correct = match.
   ev flags: ev=collect exit velo, evRequired=needed to count swing, evGate=frac of max EV that
   also gates correctness, hardHit=correct also needs >=80% max EV. */
function drillModel(key,level){
  const p=curPlayer(); const maxEV=p.maxEV;
  const nums=['1','2','3','4','5','6','7'];
  if(key==='colorBalls'){
    if(level===1) return { subtabs:['Name the Color'], panels:[
      {type:'call', kind:'color', count:10, options:COLORS.map(c=>c.k), colorClass:true,
        objective:'Call the color of the ball you hit — Red, Green, Black or Blue.',
        goal:'Get 80% correct to reach Level 2', thresholds:[{k:'Pass',v:80}]}
    ]};
    if(level===2) return { subtabs:['No Red'], panels:[
      {type:'decide', kind:'color', count:10, thrownOpts:['Red','Not Red'], rule:(t)=> t==='Red'?'Take':'Swing',
        objective:'No-Red: TAKE every red ball, swing at every other color.',
        goal:'Get 80% correct to reach Level 3', thresholds:[{k:'Pass',v:80}]}
    ]};
    if(level===3) return { subtabs:['Color + 70% EV'], panels:[
      {type:'call', kind:'color', count:10, options:COLORS.map(c=>c.k), colorClass:true, ev:true, evRequired:true, evGate:0.70, maxEV,
        objective:'Call the color AND hit it at ≥70% of max EV. Both are required to count.',
        goal:'Get 80% correct to reach Level 4', thresholds:[{k:'Pass',v:80}]}
    ]};
    if(level===4) return { subtabs:['No Red + 70% EV'], panels:[
      {type:'decide', kind:'color', count:10, thrownOpts:['Red','Not Red'], rule:(t)=> t==='Red'?'Take':'Swing', ev:true, evGate:0.70, maxEV,
        objective:'TAKE every red. Every non-red you swing at must be hit at ≥70% of max EV to count.',
        goal:'Get 70% correct to reach Level 5', thresholds:[{k:'Pass',v:70}]}
    ]};
    return { subtabs:['Blue Only'], panels:[
      {type:'decide', kind:'color', count:10, thrownOpts:['Blue','Not Blue'], rule:(t)=> t==='Blue'?'Swing':'Take',
        objective:'Blue only: swing at BLUE, take every other color. Any swing at a non-blue ball is a miss.',
        goal:'Get 80% correct to master this level', thresholds:[{k:'Pass',v:80}]}
    ]};
  }
  if(key==='sevenBall'){
    if(level===1) return { subtabs:['Number'], panels:[
      {type:'call', kind:'number', count:10, options:nums,
        objective:'Call the number (1–7) the ball crosses. 1 = closest to hitter, 7 = furthest.',
        goal:'Get 80% correct to reach Level 2', thresholds:[{k:'Pass',v:80}]}
    ]};
    if(level===2) return { subtabs:['0-Strike'], panels:[
      {type:'decide', kind:'number', count:10, thrownOpts:nums, rule:(t)=> ['3','4','5'].includes(t)?'Swing':'Take',
        objective:'0-Strike count: swing only at 3-4-5, take 1, 2, 6 and 7.',
        goal:'Get 80% correct to reach Level 3', thresholds:[{k:'Pass',v:80}]}
    ]};
    if(level===3) return { subtabs:['Number + 60% EV'], panels:[
      {type:'call', kind:'number', count:10, options:nums, ev:true, evRequired:true, evGate:0.60, maxEV,
        objective:'Call the number AND hit it at ≥60% of max EV. Both are required to count.',
        goal:'Get 80% correct to reach Level 4', thresholds:[{k:'Pass',v:80}]}
    ]};
    if(level===4) return { subtabs:['0-Strike + 90% EV'], panels:[
      {type:'decide', kind:'number', count:10, thrownOpts:nums, rule:(t)=> ['3','4','5'].includes(t)?'Swing':'Take', ev:true, evGate:0.90, maxEV,
        objective:'0-Strike: take 1, 2, 6, 7. Every 3-4-5 you swing at must be hit at ≥90% of max EV to count.',
        goal:'Get 80% correct to reach Level 5', thresholds:[{k:'Pass',v:80}]}
    ]};
    return { subtabs:['Live BP'], panels:[
      {type:'call', kind:'number', count:10, options:nums, ev:true, evRequired:true, evGate:0.70, maxEV,
        objective:'Live batting practice: call the number AND hit it at ≥70% of max EV. Both are required.',
        goal:'Get 80% correct to master this level', thresholds:[{k:'Pass',v:80}]}
    ]};
  }
  if(key==='threes'){
    const seq=['GB','GB','GB','LD','LD','LD','FB','FB','FB'];
    if(level===1) return { subtabs:['3·3·3'], panels:[
      {type:'spray', kind:'batted', targets:seq, options:BATTED,
        objective:'On command hit 3 ground balls, 3 line drives, then 3 fly balls.',
        goal:'Pass at 70%', thresholds:[{k:'Pass',v:70}]}
    ]};
    if(level===2) return { subtabs:['3·3·3 + EV'], panels:[
      {type:'spray', kind:'batted', targets:seq, options:BATTED, ev:true, evRequired:true, evGate:0.6, maxEV,
        objective:'Correct batted-ball type AND hit at ≥60% of max EV on 60% of swings.',
        goal:'Level 2 pass at 60%', thresholds:[{k:'Pass',v:60}]}
    ]};
    if(level===3) return { subtabs:['Small Ball · Skinny Bat'], panels:[
      {type:'spray', kind:'batted', targets:seq, options:BATTED,
        objective:'Same 3·3·3 — but with SMALL BALLS and a SKINNY TRAINER BAT. Hit the commanded type each swing.',
        goal:'Get over 70% correct to reach Level 4', thresholds:[{k:'Pass',v:70}]}
    ]};
    return { subtabs:['3·3·3 + EV / Distance'], panels:[
      {type:'spray', kind:'batted', targets:seq, options:BATTED, ev:true, evGate:0.75, fbDistance:150, maxEV,
        objective:'Correct type AND: ground balls & line drives hit ≥75% of max EV; fly balls carry ≥150 ft. Over 70% of swings must clear the bar.',
        goal:'Get over 70% correct to master (more levels coming)', thresholds:[{k:'Pass',v:70}]}
    ]};
  }
  if(key==='atw'){
    const seq=['LF','LF','LCF','LCF','CF','CF','RCF','RCF','RF','RF'];
    if(level===1) return { subtabs:['Around the World'], panels:[
      {type:'spray', kind:'field', targets:seq, options:FIELDS,
        objective:'Spray 2 balls to each field: LF, LCF, CF, RCF, RF.',
        goal:'Pass at 50%', thresholds:[{k:'Pass',v:50}]}
    ]};
    return { subtabs:['Around the World + EV'], panels:[
      {type:'spray', kind:'field', targets:seq, options:FIELDS, ev:true, maxEV,
        objective:'Spray 2 balls to each field, LF → RF. Log exit velo on every swing.',
        goal:'Level 2 pass at 70%', thresholds:[{k:'Pass',v:70}]}
    ]};
  }
  return {subtabs:['Rapsodo'],panels:[]};
}

/* per-session slot storage keyed by subtab */
function slots(){
  if(!SESSION._slots) SESSION._slots={};
  const m=drillModel(SESSION.key,SESSION.level);
  const key=SESSION.sub;
  if(!SESSION._slots[key]){
    const panel=m.panels[key];
    const n = panel.count || (panel.targets?panel.targets.length:10);
    SESSION._slots[key]=Array.from({length:n},(_,i)=>({
      i, thrown: panel.targets?panel.targets[i]:'',
      called:'', action:'', actual:'', ev:0, dist:0, _done:false, _ovr:null
    }));
  }
  return SESSION._slots[key];
}

/* auto correctness per swing */
function swingCorrect(panel, s){
  if(!s._done) return false;
  if(panel.type==='call'){
    let ok = !!(s.thrown && s.called && s.thrown===s.called);
    if(ok && panel.hardHit) ok = isHardHit(s.ev, panel.maxEV);
    if(ok && panel.evGate) ok = panel.maxEV>0 && s.ev>=panel.evGate*panel.maxEV;
    return ok;
  }
  if(panel.type==='decide'){
    const want = panel.rule(s.thrown);
    let ok = !!(s.action && s.action===want);
    if(ok && panel.evGate && want==='Swing') ok = panel.maxEV>0 && s.ev>=panel.evGate*panel.maxEV;
    return ok;
  }
  if(panel.type==='spray'){
    let ok = s.actual===s.thrown;
    if(ok && (panel.evGate || panel.fbDistance)){
      if(panel.fbDistance && s.thrown==='FB') ok = (s.dist||0) >= panel.fbDistance;
      else if(panel.evGate) ok = panel.maxEV>0 && s.ev>=panel.evGate*panel.maxEV;
    }
    return !!ok;
  }
  return false;
}
/* number-only match (ignores EV) — used for 7-Ball 'Number' metric + pattern */
function nameCorrect(panel, s){
  if(!s._done) return false;
  if(panel.type==='call') return !!(s.thrown && s.called && s.thrown===s.called);
  if(panel.type==='spray') return s.actual===s.thrown;
  if(panel.type==='decide') return !!(s.action && s.action===panel.rule(s.thrown));
  return false;
}
/* displayed result honours a manual coach override */
function swingResult(panel, s){
  if(s._ovr===true||s._ovr===false) return s._ovr;
  return swingCorrect(panel, s);
}

/* ---------- DRILL VIEW ---------- */
function viewDrill(){
  if(SESSION.key==='rapsodo') return viewRapsodo();
  const p=curPlayer();
  const m=drillModel(SESSION.key,SESSION.level);
  const d=DRILLS[SESSION.key];
  const panel=m.panels[SESSION.sub];
  const arr=slots();

  const done=arr.filter(s=>s._done).length;
  const correct=arr.filter(s=>swingResult(panel,s)).length;
  const acc=pct(correct,done);

  // score strip (thresholds + special metrics)
  let scs = panel.thresholds.map(t=>{
    let val=acc, lbl=t.k;
    if(t.k==='Hard Hit'){ const hh=arr.filter(s=>s._done && isHardHit(s.ev,panel.maxEV)).length; val=pct(hh,done); }
    if(t.k==='Number'){ val=pct(arr.filter(s=>nameCorrect(panel,s)).length,done); }
    const passed = done>0 && val>=t.v;
    return `<div class="sc ${done>0?(passed?'pass':'fail'):''}"><div class="k">${lbl} ≥${t.v}%</div><div class="v">${val}%</div></div>`;
  }).join('');
  scs = `<div class="sc"><div class="k">Logged</div><div class="v">${done}/${arr.length}</div></div>`+scs;

  const rows = arr.map((s,i)=>swingRow(panel,s,i)).join('');
  const subtabsHtml = m.subtabs.length>1 ? `<div class="subtabs">${m.subtabs.map((t,i)=>
     `<button class="${i===SESSION.sub?'on':''}" onclick="SESSION.sub=${i};render()">${t}</button>`).join('')}</div>`:'';

  return `<div class="scroll">
    ${topbar(`<button class="icon-btn" onclick="go('profile')">${IC.back}</button>`)}
    <div class="logger-head">
      <h2>${d.name.toUpperCase()} <em>· L${SESSION.level}</em></h2>
    </div>
    ${subtabsHtml}
    <div class="objective">
      <div class="badge-n"><div class="num">${arr.length}</div><div class="u2">swings</div></div>
      <div class="otxt"><b>${esc(panel.objective)}</b><br>${esc(panel.goal||'')}</div>
    </div>
    <div class="score-strip">${scs}</div>
    ${scoreChart(panel,arr)}
    <div class="swing-list">${rows}</div>
    ${patternAnalysis(panel,arr)}
    <div class="save-bar"><button class="btn" onclick="saveDrill()">Save Results to Week ${p.assessments[p.assessments.length-1].week}</button></div>
    <div style="height:10px"></div>
  </div>`;
}

/* live scoring chart — one pill per swing, tap to jump */
function scoreChart(panel,arr){
  const done=arr.filter(s=>s._done).length;
  const correct=arr.filter(s=>swingResult(panel,s)).length;
  const pills=arr.map((s,i)=>{ const st=!s._done?'p-none':(swingResult(panel,s)?'p-ok':'p-no');
    return `<button class="pill ${st}" onclick="scrollToSwing(${i})">${i+1}</button>`; }).join('');
  return `<div class="chart-wrap"><div class="chart-lbl"><span>SCORING CHART</span><span><b>${correct}</b> / ${done} correct</span></div><div class="pills">${pills}</div></div>`;
}

/* efficient recording row */
function swingRow(panel,s,i){
  const res = swingResult(panel,s);
  const cls = !s._done?'empty':(res?'correct':'wrong');
  const resTag = s._done
    ? `<button class="tag ${res?'ok':'no'}" onclick="toggleResult(${i})">${res?'✓ Correct':'✗ Miss'}</button>`
    : `<span class="tag round">awaiting</span>`;
  let body='';

  if(panel.type==='call'){
    const pick=(field,val)=> panel.colorClass?segColors(i,field,val):segList(i,field,val,panel.options,'big');
    body += `<div class="lab">${panel.colorClass?'Ball thrown (color)':'Ball crossed # (1 near → 7 far)'}</div>${pick('thrown',s.thrown)}`;
    body += `<div class="lab">Kid called</div>${pick('called',s.called)}`;
    if(panel.ev) body += evInput(i,s);
  }
  else if(panel.type==='decide'){
    const isNum = panel.kind==='number';
    body += `<div class="lab">${isNum?'Ball crossed # (1 near → 7 far)':'Ball thrown'}</div>${segList(i,'thrown',s.thrown,panel.thrownOpts,isNum?'big':'')}`;
    if(s.thrown) body += `<div class="lab">Should <b style="color:var(--green)">${panel.rule(s.thrown)}</b> · kid's decision</div>`;
    else body += `<div class="lab">Kid's decision</div>`;
    body += `${segList(i,'action',s.action,['Swing','Take'],'',['swing-y','take-n'])}`;
    if(panel.ev && s.action==='Swing') body += evInput(i,s);
  }
  else if(panel.type==='spray'){
    body += `<div class="lab">Target — hit to <b style="color:var(--green)">${s.thrown}</b></div>`;
    body += `<div class="lab">Actually went to</div>${segList(i,'actual',s.actual,panel.options,'')}`;
    if(panel.fbDistance && s.thrown==='FB') body += distInput(i,s);
    else if(panel.ev) body += evInput(i,s);
  }

  return `<div class="swing ${cls}" id="sw${i}">
    <div class="sh"><span class="n">Swing ${i+1}</span>${resTag}</div>${body}</div>`;
}

function segColors(i,field,val){
  return `<div class="segrow">${COLORS.map(c=>
    `<button class="seg ${c.c} ${val===c.k?'on':''}" onclick="setField(${i},'${field}','${c.k}')">${c.k}</button>`).join('')}</div>`;
}
function segList(i,field,val,opts,big,extraCls){
  return `<div class="segrow">${opts.map((o,j)=>{
    const ec = extraCls?extraCls[j]:'';
    return `<button class="seg ${big} ${ec} ${val===o?'on':''}" onclick="setField(${i},'${field}','${o}')">${o}</button>`;
  }).join('')}</div>`;
}
function evInput(i,s){
  return `<div class="lab" style="margin-top:8px">Exit velo (mph)</div>
    <div class="numrow"><input type="number" inputmode="numeric" placeholder="mph" value="${s.ev||''}" onchange="setEV(${i},this.value)"><span class="u">max ${SESSION.maxEV||'—'}</span></div>`;
}
function distInput(i,s){
  return `<div class="lab" style="margin-top:8px">Fly-ball distance (ft)</div>
    <div class="numrow"><input type="number" inputmode="numeric" placeholder="ft" value="${s.dist||''}" onchange="setDist(${i},this.value)"><span class="u">need ≥150</span></div>`;
}
function scrollToSwing(i){ requestAnimationFrame(()=>{const e=$('#sw'+i); if(e) e.scrollIntoView({block:'center',behavior:'smooth'});}); }
function setField(i,field,val){
  const s=slots()[i]; s[field]=(s[field]===val?'':val); s._ovr=null; markDone(s); render(); scrollToSwing(i);
}
function setEV(i,v){ const s=slots()[i]; s.ev=+v||0; s._ovr=null; markDone(s); render(); }
function setDist(i,v){ const s=slots()[i]; s.dist=+v||0; s._ovr=null; markDone(s); render(); }
/* one-tap: mark the kid got this swing right */
function quickCorrect(i){
  const m=drillModel(SESSION.key,SESSION.level), panel=m.panels[SESSION.sub], s=slots()[i];
  if(panel.type==='call'){ if(!s.thrown){ toast('Set the thrown value first'); return; } s.called=s.thrown; }
  else if(panel.type==='spray'){ s.actual=s.thrown; }
  else if(panel.type==='decide'){ if(!s.thrown){ toast('Set the ball first'); return; } s.action=panel.rule(s.thrown); }
  s._ovr=null; markDone(s); render(); scrollToSwing(i);
}
/* manual correct/incorrect override toggle */
function toggleResult(i){
  const m=drillModel(SESSION.key,SESSION.level), panel=m.panels[SESSION.sub], s=slots()[i];
  s._ovr = !swingResult(panel,s); render();
}
function markDone(s){
  const m=drillModel(SESSION.key,SESSION.level), panel=m.panels[SESSION.sub];
  if(panel.type==='call') s._done = !!(s.thrown && s.called && (!panel.evRequired || s.ev>0));
  else if(panel.type==='decide') s._done = !!(s.thrown && s.action);
  else if(panel.type==='spray') s._done = !!(s.actual && (!panel.evRequired || s.ev>0));
}

function colorSwatch(cat){ return ({Red:'#e23b3b',Green:'#37c837',Black:'#111',Blue:'#3d7bff','Not Red':'#5a5f5a','Not Blue':'#5a5f5a'})[cat] || 'var(--green)'; }

/* compute a serializable breakdown (accuracy per thrown value + what the kid chose when wrong) */
function computeBreakdown(panel,arr){
  const done=arr.filter(s=>s._done);
  let cats, thrownOf, choseOf, kindLbl, catLbl, colorCats;
  if(panel.type==='call'){ cats=panel.options; thrownOf=s=>s.thrown; choseOf=s=>s.called;
    kindLbl=panel.colorClass?'Color':'Number'; catLbl=panel.colorClass?'color':'number'; colorCats=!!panel.colorClass; }
  else if(panel.type==='spray'){ cats=panel.options; thrownOf=s=>s.thrown; choseOf=s=>s.actual;
    kindLbl='Location'; catLbl='location'; colorCats=false; }
  else { cats=panel.thrownOpts; thrownOf=s=>s.thrown; choseOf=s=>s.action; kindLbl='Pitch'; catLbl='pitch'; colorCats=(panel.kind==='color'); }
  const rows = cats.map(cat=>{
    const th=done.filter(s=>thrownOf(s)===cat);
    if(!th.length) return {cat, total:0, correct:0, pct:null, miss:{}};
    const right=th.filter(s=>swingResult(panel,s)).length;
    const miss={}; th.filter(s=>!swingResult(panel,s)).forEach(s=>{ const c=choseOf(s)||'no call'; miss[c]=(miss[c]||0)+1; });
    return {cat, total:th.length, correct:right, pct:pct(right,th.length), miss};
  });
  let weak=null;
  rows.forEach(r=>{ if(r.total){ if(weak===null||r.pct<weak.pct) weak={cat:r.cat, pct:r.pct}; }});
  return {kindLbl, catLbl, colorCats, rows, weak, doneCount:done.length};
}
/* render a breakdown (live or saved) into the pattern + recommendation panel */
function renderBreakdown(bd){
  if(!bd || !bd.doneCount) return '';
  const rows = bd.rows.map(r=>{
    const sw = bd.colorCats?colorSwatch(r.cat):'var(--green)';
    if(!r.total) return `<div class="arow"><div class="cl"><span class="dot" style="background:${sw}"></span>${r.cat}</div>
      <div class="bar"><i style="width:0%"></i></div><div class="pc">—</div></div>`;
    const barcol=r.pct>=80?'var(--green)':r.pct>=50?'var(--amber)':'var(--red)';
    const missTxt=Object.keys(r.miss||{}).length? ('when missed, said '+Object.entries(r.miss).map(([k,v])=>`<b>${k}</b>${v>1?' ×'+v:''}`).join(', ')) : '';
    return `<div class="arow"><div class="cl"><span class="dot" style="background:${sw}"></span>${r.cat}</div>
      <div class="bar"><i style="width:${r.pct}%;background:${barcol}"></i></div>
      <div class="pc"><b>${r.pct}%</b> ${r.correct}/${r.total}</div></div>
      ${missTxt?`<div class="miss-note">↳ ${missTxt}</div>`:''}`;
  }).join('');
  const insight = bd.weak && bd.weak.pct<80
    ? `<div class="insight"><b>Work on:</b> ${bd.kindLbl.toLowerCase()} <b>${bd.weak.cat}</b> — only ${bd.weak.pct}% here. Build reps around ${bd.weak.cat} and re-test next block.</div>`
    : `<div class="insight good"><b>Looking sharp.</b> No single ${bd.catLbl} is lagging badly — keep building volume.</div>`;
  return `<div class="analysis"><h4>${bd.kindLbl} pattern — where they struggle</h4><div class="amx">${rows}</div></div>${insight}`;
}
function patternAnalysis(panel,arr){ return renderBreakdown(computeBreakdown(panel,arr)); }

/* metric value for a given threshold key */
function panelMetricVal(panel, arr, tKey){
  const done=arr.filter(s=>s._done).length;
  if(tKey==='Hard Hit') return pct(arr.filter(s=>s._done && isHardHit(s.ev,panel.maxEV)).length, done);
  if(tKey==='Number') return pct(arr.filter(s=>nameCorrect(panel,s)).length, done);
  return pct(arr.filter(s=>swingResult(panel,s)).length, done);
}
/* a panel passes when every swing is logged and all its thresholds are met */
function panelPasses(panel, arr){
  const need = panel.count || (panel.targets?panel.targets.length:10);
  if(arr.filter(s=>s._done).length < need) return false;
  return panel.thresholds.every(t=> panelMetricVal(panel,arr,t.k) >= t.v);
}
/* the whole level passes when every panel in the model passes */
function levelComplete(){
  const m=drillModel(SESSION.key,SESSION.level);
  return m.panels.every((panel,idx)=>{ const a=SESSION._slots&&SESSION._slots[idx]; return a && panelPasses(panel,a); });
}
function saveDrill(){
  const p=curPlayer(); const m=drillModel(SESSION.key,SESSION.level), panel=m.panels[SESSION.sub];
  const arr=slots(); const done=arr.filter(s=>s._done).length;
  if(!done){ toast('Log at least one swing first'); return; }
  const acc=pct(arr.filter(s=>swingResult(panel,s)).length,done);
  const aw=ensureCurrentAssessment(p);
  aw.drills[SESSION.key]={pct:acc, label:m.subtabs[SESSION.sub]+' · L'+SESSION.level, level:SESSION.level, breakdown:computeBreakdown(panel,arr)};
  cloudSavePlayer(p);
  // level complete?
  if(levelComplete() && SESSION.level===p.levels[SESSION.key] && p.levels[SESSION.key]<maxLevel(SESSION.key)){
    p.levels[SESSION.key]=SESSION.level+1; cloudSavePlayer(p);
    go('reward',{drill:SESSION.key, fromLevel:SESSION.level, pct:acc});
    return;
  }
  // multi-panel drill: jump to the next unfinished sub-drill
  if(m.panels.length>1){
    for(let idx=0; idx<m.panels.length; idx++){
      const a=SESSION._slots&&SESSION._slots[idx];
      if(!(a && panelPasses(m.panels[idx],a))){ SESSION.sub=idx; toast('Saved. Now finish “'+m.subtabs[idx]+'” to complete Level '+SESSION.level); render(); return; }
    }
  }
  toast('Saved — '+acc+'% to Week '+aw.week);
  setTimeout(()=>go('profile'),800);
}

/* ---------- RAPSODO baseline logger ---------- */
function buildRapsodo(p){
  const rounds = p.age<=8?2:3;
  const names=['Off Tee','Front Toss','Pitching Machine'];
  const arr=[];
  for(let r=0;r<rounds;r++) for(let i=0;i<8;i++) arr.push({round:r, name:names[r], ev:0, dist:0});
  return arr;
}
function viewRapsodo(){
  const p=curPlayer(); const arr=SESSION.rapsodo;
  const st=rapsodoStats(arr);
  const rows=arr.map((s,i)=>`
    <div class="swing ${s.ev>0?(isHardHit(s.ev,st.maxEV)?'correct':'empty'):'empty'}">
      <div class="sh"><span class="n">Swing ${(i%8)+1} · ${s.name}</span>
        ${s.ev>0?(isHardHit(s.ev,st.maxEV)?'<span class="tag ok">Hard Hit</span>':'<span class="tag round">In play</span>'):'<span class="tag round">Round '+(s.round+1)+'</span>'}</div>
      <div class="numrow"><input type="number" placeholder="Exit velo (mph)" value="${s.ev||''}" onchange="SESSION.rapsodo[${i}].ev=+this.value||0;render()">
        <input type="number" placeholder="Distance (ft)" value="${s.dist||''}" onchange="SESSION.rapsodo[${i}].dist=+this.value||0;render()"></div>
    </div>`).join('');
  const roundsInfo = p.age<=8? '2 rounds of 8 (Tee, Front Toss) — under-8, no pitching machine.' : '3 rounds of 8 (Tee, Front Toss, Machine).';
  const cloud = SESSION.pulled
    ? `<button class="rap-pull done" onclick="pullRapsodo()">✓ Synced ${arr.length} swings — pull again</button>`
    : `<button class="rap-pull" onclick="pullRapsodo()">${IC.sync} Pull latest session from Rapsodo</button>`;
  return `<div class="scroll">
    ${topbar(`<button class="icon-btn" onclick="go('profile')">${IC.back}</button>`)}
    <div class="logger-head"><h2>RAPSODO <em>ASSESSMENT</em></h2><div class="desc">${roundsInfo} Hard-hit = a swing ≥ 80% of this session's max exit velo.</div></div>
    <div class="rap-cloud">
      <div class="rc-top"><span class="rc-dot"></span><span class="t">Connected to <b>cloud.rapsodo.com</b></span></div>
      <div class="rc-sub">${p.first}'s swings import automatically — Avg EV, Max EV, distance and hard-hit % calculate for you. Edit any value by hand if needed.</div>
      ${cloud}
    </div>
    <div class="score-strip">
      <div class="sc"><div class="k">Avg EV</div><div class="v">${st.avgEV||'—'}</div></div>
      <div class="sc pass"><div class="k">Max EV</div><div class="v">${st.maxEV||'—'}</div></div>
      <div class="sc"><div class="k">Avg Dist</div><div class="v">${st.avgDist||'—'}</div></div>
      <div class="sc"><div class="k">Max Dist</div><div class="v">${st.maxDist||'—'}</div></div>
    </div>
    <div class="score-strip"><div class="sc ${st.hardHitPct>=50?'pass':''}" style="flex:1"><div class="k">Hard Hit %  (≥80% of ${st.maxEV||'max'} mph)</div><div class="v">${st.hardHitPct}%</div></div></div>
    <div class="swing-list">${rows}</div>
    <div class="save-bar"><button class="btn" onclick="saveRapsodo()">Save Rapsodo Baseline</button></div>
    <div style="height:10px"></div>
  </div>`;
}
/* simulate importing a session from cloud.rapsodo.com */
function pullRapsodo(){
  const p=curPlayer();
  const base = (p.maxEV&&p.maxEV>0)? p.maxEV : (p.age<=8?42:58);
  const roundBoost=[-5,0,4]; // tee lower, machine highest
  SESSION.rapsodo.forEach(s=>{
    const spread = -7 + Math.random()*12;
    const v = Math.max(20, Math.round(base + (roundBoost[s.round]||0) + spread));
    s.ev = v;
    s.dist = Math.max(30, Math.round(v*3.4 - 15 + Math.random()*40));
  });
  SESSION.pulled=true;
  toast('Imported '+SESSION.rapsodo.length+' swings from Rapsodo');
  render();
}
function saveRapsodo(){
  const p=curPlayer(); const st=rapsodoStats(SESSION.rapsodo);
  if(!st.n){ toast('Pull from Rapsodo or enter some exit velos first'); return; }
  p.maxEV=st.maxEV;
  const aw=curAssess(); aw.maxEV=st.maxEV;
  aw.drills.rapsodo={pct:st.hardHitPct,label:'Hard Hit'};
  cloudSavePlayer(p);
  toast('Rapsodo saved — Max EV '+st.maxEV+' mph');
  setTimeout(()=>go('profile'),700);
}

/* =============== VIDEO-GAME LEVEL-UP CELEBRATION =============== */
/* ---------- PAST RESULTS / BREAKDOWNS (coach + parent) ---------- */
function resultsList(p, wkIdx){
  const aw=blockAssessment(p, wkIdx); if(!aw) return '';

      <div class="p-photo" style="display:flex;align-items:center;justify-content:center;background:var(--panel-2);color:var(--green);font-family:'Anton';font-style:italic;font-size:19px">${r.pct}%</div>
      <div class="p-info"><h3>${d.name}</h3><div class="meta">${focus}</div></div>
      ${IC.chev}
    </button>`;
  }).join('');
}
function viewResults(){
  const p=curPlayer(); const c=DB.ctx;
  const bi=(c.week!=null)? c.week : 0;
  const aw=blockAssessment(p,bi) || {week:bi*4+1, drills:{}};
  const key=c.drillKey; const d=DRILLS[key]||{name:'Drill'};
  const res=(aw.drills&&aw.drills[key])||{};
  const isParent=AUTH && AUTH.role==='parent';
  const back="go('block',{block:"+bi+"})";
  const body=res.breakdown ? renderBreakdown(res.breakdown)
    : `<div class="center-note">Score saved (${res.pct!=null?res.pct+'%':'—'}), but the detailed breakdown wasn't captured for this test. Tests going forward will show the full breakdown and recommendation here.</div>`;
  return `<div class="scroll">
    ${topbar(`<button class="icon-btn" onclick="${back}">${IC.back}</button>`)}
    <div class="pad">
      <div class="hello"><p>Weeks ${blockLabel(bi)} · ${esc(d.name)} · ${esc(res.label||'')}</p><h2>WHAT TO <em>WORK ON</em></h2></div>
      <div class="stat-row" style="padding:0 0 6px">
        <div class="stat"><div class="k">Score</div><div class="v" style="color:var(--green)">${res.pct!=null?res.pct:'—'}<small>%</small></div></div>
        <div class="stat"><div class="k">Drill</div><div class="v" style="font-size:15px">${esc(d.name)}</div></div>
        <div class="stat"><div class="k">Block</div><div class="v" style="font-size:15px">Wks ${blockLabel(bi)}</div></div>
      </div>
      ${body}
      <div style="height:24px"></div>
    </div>
  </div>
  ${isParent?parentTabbar():tabbar('')}`;
}

function viewReward(){
  const p=curPlayer(); const c=DB.ctx;
  const d=DRILLS[c.drill]||{name:'Color Balls',icon:'C'};
  const newLevel=(c.fromLevel||1)+1; const mastered=newLevel>maxLevel(c.drill);
  const scorePct=c.pct!=null?c.pct:90;
  const stars=scorePct>=90?3:scorePct>=75?2:1;
  const starHtml=[0,1,2].map(i=>`<span class="rw-star ${i<stars?'lit':''}" style="animation-delay:${.5+i*.18}s">★</span>`).join('');
  const back = c.demo ? `onclick="DB.view='login';render()"` : `onclick="go('profile')"`;
  return `<div class="reward" id="reward">
    <div class="rw-confetti" id="confetti"></div>
    <div class="rw-inner">
      <div class="rw-burst">${logoSVG(96,false)}</div>
      <div class="rw-great">GREAT JOB!</div>
      <div class="rw-sub">${esc(p?p.first:'You')} crushed <b>${d.name}</b> — ${scorePct}%</div>
      <div class="rw-stars">${starHtml}</div>
      <div class="rw-unlock">
        <div class="rw-lock" id="rwlock">${mastered?'<span style="font-size:24px;color:var(--green)">★</span>':IC.lock}</div>
        <div class="rw-unlock-txt">${mastered?`<span>${esc(d.name).toUpperCase()}</span><b>MASTERED!</b>`:`<span>LEVEL ${newLevel}</span><b>UNLOCKED</b>`}</div>
      </div>
      <div class="rw-levelbar"><div class="rw-l l-done">LVL ${c.fromLevel||1} ✓</div>
        <div class="rw-track"><i></i></div>
        <div class="rw-l l-next">${mastered?'★ MASTER':`LVL ${newLevel}`}</div></div>
      <button class="rw-btn" ${back}>KEEP GOING ▶</button>
      <div class="rw-tag">HPL YOUTH · Hitting Performance Lab</div>
    </div>
  </div>`;
}
function startConfetti(){
  const el=$('#confetti'); if(!el) return;
  const cols=['#83f52c','#5bc70e','#ffffff','#ffb020','#3d7bff','#e23b3b'];
  let html='';
  for(let i=0;i<44;i++){
    const l=Math.random()*100, dl=Math.random()*2.2, dur=2.4+Math.random()*2.2, sz=6+Math.random()*8;
    const rot=Math.random()*360, col=cols[i%cols.length];
    html+=`<span class="cf" style="left:${l}%;width:${sz}px;height:${sz*0.5}px;background:${col};animation-delay:${dl}s;animation-duration:${dur}s;transform:rotate(${rot}deg)"></span>`;
  }
  el.innerHTML=html;
}

/* ---------- PARENT HOME (read-only, own child) ---------- */
function viewParentHome(){
  const p=curPlayer(); const last=p.assessments[p.assessments.length-1];
  const first=p.assessments[0];
  const evDelta=last.maxEV-first.maxEV;
  const drillRows=Object.keys(DRILLS).map(k=>{
    const d=DRILLS[k]; const lv=p.levels[k]; const res=last.drills[k];
    return `<div class="pp-card">
      <div class="ph"><h4>${d.name}</h4>${levelBadge(lv)}</div>
      <div class="pb">
        <div class="pp-metric"><div class="k">Current Level</div><div class="v up">L${Math.min(lv,maxLevel(k))} / ${maxLevel(k)}</div></div>
        <div class="pp-metric"><div class="k">Last Score</div><div class="v">${res?res.pct+'%':'—'}</div></div>
        <div class="pp-metric" style="flex:1"><div class="k">Focus</div><div class="muted" style="margin-top:4px">${d.desc}</div></div>
      </div></div>`;
  }).join('');
  return `<div class="scroll">
    ${topbar(`<button class="icon-btn" onclick="logout()">${IC.user}</button>`)}
    <div class="pad" style="padding-top:0">
      <div class="hello"><p>Parent view · read-only</p><h2>${esc(p.first.toUpperCase())}'S <em>PROGRESS</em></h2></div>
    </div>
    <div class="prof-hero">
      <div class="prof-photo-wrap"><img class="prof-photo" src="${p.photo}" alt=""><div class="prof-hand">${p.hand}</div></div>
      <div class="prof-name">${esc(p.first.toUpperCase())} <em>${esc(p.last.toUpperCase())}</em></div>
      <div class="prof-sub">${handWord(p.hand)} <span class="dot">•</span> ${p.age}U ${p.sport}</div>
    </div>
    <div class="stat-row">
      <div class="stat"><div class="k">Max EV Now</div><div class="v" style="color:var(--green)">${last.maxEV}<small>mph</small></div></div>
      <div class="stat"><div class="k">Since Start</div><div class="v" style="color:${evDelta>=0?'var(--green)':'#ff7b6b'}">${evDelta>=0?'+':''}${evDelta}<small>mph</small></div></div>
      <div class="stat"><div class="k">Blocks</div><div class="v">${p.assessments.length}</div></div>
    </div>
    <p class="join"><em>Training with HPL Youth since <b>${fmtDate(p.join)}</b> · Reassessed every 5 weeks</em></p>
    <div class="section-lbl">Rapsodo Numbers</div>
    <div class="rap-numbers">
      ${rapStatTile('Max Exit Velo',p.maxEV,'mph')}
      ${rapStatTile('Avg Exit Velo',p.avgEV,'mph')}
      ${rapStatTile('Max Distance',p.maxDist,'ft')}
      ${rapStatTile('Avg Distance',p.avgDist,'ft')}
    </div>
    <div class="section-lbl">Exit Velo Trend</div>
    ${evTrend(p)}
    <div class="section-lbl">Test Blocks — tap a block to see results</div>
    ${blockCarousel(p)}
    <div class="section-lbl">Drill Development</div>
    ${drillRows}
    <div style="height:20px"></div>
  </div>
  ${parentTabbar()}`;
}
function evTrend(p){
  const vals=p.assessments.map(a=>a.maxEV); const mx=Math.max(...vals), mn=Math.min(...vals)-4;
  const bars=p.assessments.map(a=>{
    const h=Math.round(((a.maxEV-mn)/(mx-mn))*90)+20;
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px">
      <div style="font-size:11px;color:var(--green);font-weight:700">${a.maxEV}</div>
      <div style="width:26px;height:${h}px;border-radius:7px 7px 0 0;background:linear-gradient(180deg,var(--green),var(--green-deep))"></div>
      <div style="font-size:10px;color:var(--grey)">WK ${a.week}</div></div>`;
  }).join('');
  return `<div style="margin:0 16px;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px 14px;display:flex;gap:10px;align-items:flex-end;height:150px">${bars}</div>`;
}
function parentTabbar(){
  return `<div class="tabbar">
    <button class="tab on">${IC.home}<span>Progress</span></button>
    <button class="tab" onclick="toast('Coming soon')">${IC.chart}<span>History</span></button>
    <button class="tab" onclick="toast('Coming soon')">${IC.ball}<span>Coach</span></button>
    <button class="tab" onclick="logout()">${IC.user}<span>Log out</span></button>
  </div>`;
}

function bindDynamic(){}

cloudInit();
